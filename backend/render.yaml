# Render Blueprint — deploy the SimplyTax API with "New +" -> "Blueprint" on render.com
# Secrets (sync: false) are entered once in the Render dashboard, never stored in git.
services:
  - type: web
    name: simplytax-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Supabase -> Settings -> Database -> Session pooler URI
        sync: false                #   postgres://postgres.erctmlhbupumvtnixlnc:[PASSWORD]@aws-0-eu-west-2.pooler.supabase.com:5432/postgres
      - key: JWT_SECRET            # long random string, 64+ characters
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://www.taxfile24.com
      - key: FRONTEND_URL
        value: https://www.taxfile24.com/
       - key: PRICE_CENTS
        value: "1799"
      # CRITICAL: controls whether real ELSTER submissions include the
      # test flag (<Testmerker>) that causes ELSTER's own servers to
      # silently discard the data instead of processing it as a real
      # return. Must be the exact string "production" to send genuine
      # submissions - anything else (missing, empty, wrong case, an
      # abbreviation) safely defaults to test mode in the actual code.
      # This value should only ever be changed to "production" as a
      # deliberate, visible step for the real release - never left
      # ambiguous as an undocumented manual entry on Render's dashboard.
      - key: ERIC_SUBMISSION_MODE
        value: "test"
       - key: STRIPE_SECRET_KEY     # leave empty until payments go live
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # leave empty until payments go live
        sync: false
      - key: PAYPAL_CLIENT_ID      # leave empty until PayPal is set up; from developer.paypal.com
        sync: false
      - key: PAYPAL_CLIENT_SECRET  # leave empty until PayPal is set up
        sync: false
      - key: PAYPAL_WEBHOOK_ID     # from the webhook created in the PayPal developer dashboard
        sync: false
      - key: PAYPAL_API_BASE       # https://api-m.sandbox.paypal.com for testing, https://api-m.paypal.com once live
        value: "https://api-m.sandbox.paypal.com"
      - key: SUPABASE_URL
        value: https://erctmlhbupumvtnixlnc.supabase.co
      - key: SUPABASE_SERVICE_KEY  # Supabase -> Settings -> API -> service_role (secret!)
        sync: false
      - key: BREVO_API_KEY        # leave empty to keep reminder emails disabled
        sync: false
      - key: REMINDER_FROM
        value: SimplyTax <support@taxfile24.com>
      - key: REMINDER_DAYS
        value: "3"
      - key: REMINDER_CRON_SECRET  # any random string; used by the daily cron caller
        sync: false
