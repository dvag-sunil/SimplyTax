name: Deploy to GitHub Pages

# CORRECTED: this used to trigger on both main and production, but
# GitHub Pages only has one destination per repository - both branches
# were silently deploying to the exact same place, whichever pushed
# most recently overwriting the other. That's directly incompatible
# with "only production code should ever reach the live domain" - now
# restricted to production only. main no longer auto-deploys publicly;
# workflow_dispatch is still available for a manual run if ever needed.
on:
  push:
    branches: [production]
  workflow_dispatch: # allows a manual re-run from GitHub's own Actions tab, if ever needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the branch that triggered this build
        uses: actions/checkout@v4

      - name: Substitute the correct backend URL
        # The one real Render URL this whole project's live deploy
        # uses - written down here once. If the Render service's URL
        # ever changes, update it here, not in index.html itself.
        run: |
          REAL_URL="https://simplytax-api.onrender.com"
          echo "Deploying production with backend URL: $REAL_URL"
          sed -i "s|__BACKEND_URL__|$REAL_URL|g" index.html
          if grep -q "__BACKEND_URL__" index.html; then
            echo "::error::Placeholder __BACKEND_URL__ still present after substitution - deploy stopped."
            exit 1
          fi

      - name: Prepare the Pages upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
