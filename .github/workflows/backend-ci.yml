name: Backend CI

# IMPLEMENTED: addresses the audit's own recommendation (§16, automated
# regression gates) directly - and is shaped specifically around the
# real, two-part incident this project just spent days debugging:
# (1) a runtime crash (app.options('*', ...) under Express 5) that
# `node --check` alone would never have caught, since it's a syntax-valid
# line that only throws once the code actually executes, and
# (2) a deploy that looked successful on Render's side while silently
# running an old commit, undetected for days because nothing ever
# verified what was actually live matched what was actually pushed.
# This workflow is built to catch both, before either ever reaches
# production again.

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch: # lets the post-deploy verification job below be run manually from GitHub's Actions tab, after a real Render deploy has finished

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest

    # A real, ephemeral Postgres instance - not a fake connection string -
    # so the smoke test below matches production closely enough to be
    # trustworthy, rather than risk a false pass from an untested
    # assumption about whether the database connection is lazy at startup.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: simplytax_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the branch that triggered this run
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm ci installs EXACTLY what package-lock.json pins (reproducible, and fails if lock and package.json disagree)
      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "::warning::no package-lock.json committed - falling back to npm install (not reproducible)"; npm install; fi

      - name: Syntax check server.js
        working-directory: backend
        run: node --check server.js

      - name: Run the xml-builder structural test suite
        working-directory: backend/eric
        env:
          ERIC_HERSTELLER_ID: TEST
        run: node test-xml-builder.js

      - name: Run the eric-fieldmap test suite
        working-directory: backend/eric
        env:
          ERIC_HERSTELLER_ID: TEST
        run: node test-fieldmap.js

      # --- Added after a security audit: the API and security suites were never run in CI, so nothing would have caught
      # a payment-gate bypass or a data-wiping save. They run the REAL server.js against an in-memory Postgres (pg-mem)
      # with a mocked ERiC. Each runs in its own process so the server's brute-force rate limiter starts fresh.
      - name: Backend API regression suite
        working-directory: backend
        env:
          FRONTEND_URL: https://www.taxfile24.com/
          CERT_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
        run: node test/test-api.js

      - name: Security attack suite (payment forgery, IDOR, CSRF, JWT, timing, rate limit ...)
        working-directory: backend
        env:
          FRONTEND_URL: https://www.taxfile24.com/
          CERT_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
        # S15 (JWT also returned in the body) is a KNOWN, documented trade-off until the API moves to a same-site subdomain:
        # the suite is expected to report exactly that one item. Anything else failing fails the build.
        run: |
          node test/test-security.js | tee /tmp/sec.txt || true
          if grep -E '^VULNERABLE' /tmp/sec.txt | grep -v ' S15 '; then echo "::error::A security regression was detected"; exit 1; fi

      - name: Payment security suite (Stripe + PayPal webhooks, refund replay, amount/currency checks)
        working-directory: backend
        env:
          FRONTEND_URL: https://www.taxfile24.com/
          CERT_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
        run: node test/test-payments.js

      - name: Security suite - state and integrity (server-owned fields, immutability, deletion)
        working-directory: backend
        env:
          FRONTEND_URL: https://www.taxfile24.com/
          CERT_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
        run: node test/test-security-state.js

      - name: Frontend logic suite (the real index.html script, DOM stubbed)
        working-directory: test
        run: node test-ui.js

      - name: Dependency audit - fail on critical, report the rest
        working-directory: backend
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit --omit=dev || true

      # The real point of this job - a genuine smoke test, not just a
      # syntax check. This is the step that would have caught the actual
      # incident: it starts the real server.js, exactly as Render does,
      # and confirms it genuinely opens its port and answers a real
      # request - not just that it parses without error. A runtime crash
      # like the Express 5 wildcard-route bug throws during this exact
      # startup sequence, before app.listen() is ever reached, which
      # `node --check` cannot detect but this step directly can.
      - name: Smoke test - start the real server and verify it actually responds
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/simplytax_ci
          JWT_SECRET: ci-test-secret-not-for-production
          PORT: 3000
          ALLOWED_ORIGIN: https://www.taxfile24.com
          # CORRECTED: real CI failure found directly from a live run -
          # server.js was deliberately changed to refuse to start without
          # FRONTEND_URL (it's used for password-reset links, email
          # verification links, and Stripe redirects, so a missing value
          # there is a real production risk, not just a CORS edge case).
          # That fix is correct and working exactly as intended - this
          # workflow simply never provided the var here, unlike every
          # other required one already set above. Added to match.
          FRONTEND_URL: https://www.taxfile24.com/
        run: |
          node server.js &
          SERVER_PID=$!
          # Give it a real moment to either bind its port or crash -
          # matching the kind of delay that made the actual incident's
          # crash easy to miss by eye in a long build log.
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server responded successfully - genuinely listening, not just running."
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::Server process exited before ever responding - this is exactly the kind of startup crash node --check cannot catch."
              exit 1
            fi
            sleep 1
          done
          echo "::error::Server never responded to /api/health within 15 seconds - likely hung or failed to bind its port."
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  # A separate, deliberately post-deploy job - only meaningful after a
  # real deploy to Render has actually happened, so it's a manual trigger
  # rather than tied to the push event above (which fires before Render
  # has necessarily finished deploying). Addresses the second real half
  # of the actual incident directly: confirming what's live is genuinely
  # what was just pushed, not assumed to be.
  verify-live-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out the branch that triggered this run
        uses: actions/checkout@v4

      - name: Confirm the live commit matches what was just pushed
        shell: bash
        run: |
          PUSHED_COMMIT="${{ github.sha }}"
          LIVE_COMMIT=$(curl -sf https://simplytax-api.onrender.com/api/version | node -pe 'JSON.parse(require("fs").readFileSync(0)).gitCommit' 2>/dev/null || echo "unreachable")
          echo "Commit just pushed: $PUSHED_COMMIT"
          echo "Commit currently live: $LIVE_COMMIT"
          if [ "$LIVE_COMMIT" = "unreachable" ]; then
            echo "::error::Could not reach /api/version on the live service at all - check it's actually up."
            exit 1
          fi
          if [ "${PUSHED_COMMIT:0:7}" != "${LIVE_COMMIT:0:7}" ]; then
            echo "::warning::Live commit does not yet match the pushed commit - this is expected immediately after a push while Render is still deploying. Re-run this job after a few minutes if it persists."
          else
            echo "Confirmed: the live service is genuinely running the commit that was just pushed."
          fi
