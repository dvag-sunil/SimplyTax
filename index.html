<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Content Security Policy: added directly in response to the production
     audit's finding ("I found no CSP in the current application"). This
     has to be a meta tag, not a server-sent header, because this app is
     hosted on GitHub Pages - a static host with no server-side control
     over HTTP response headers. Genuinely restricts which origins scripts
     can be loaded from and which origins the page is allowed to connect
     to, which blocks the two most common real outcomes of an XSS payload:
     loading an attacker's own script from another domain, and quietly
     sending stolen data (like the auth token) to an attacker-controlled
     server. Honest limitation: 'unsafe-inline' is still required for both
     script-src and style-src, because this app currently relies on 100+
     inline onclick="..." handlers and one large inline <script> block
     throughout the page - removing that would need a real refactor to
     addEventListener and external script files, which risks breaking
     functionality across the whole app if rushed, so it's flagged here
     rather than silently left as a gap. connect-src covers the backend API
     origin as a wildcard since the exact URL is injected at deploy time
     by the GitHub Actions workflow and differs between branches. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' blob: https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimplyTax - Tax Filing Workspace</title>
<style>
 :root{
 --ink:#12283A; --ink-soft:#3C5468; --paper:#F6F8F7; --card:#FFFFFF;
 --line:#DFE7E4; --teal:#0E7C66; --teal-dark:#0A5D4D; --teal-soft:#E3F1EC;
 --amber:#D98A1F; --amber-soft:#FBF1DF; --red:#B4432F; --red-soft:#F9E9E5;
 --blue-soft:#E7EEF6; --radius:14px; --shadow:0 1px 2px rgba(18,40,58,.06),0 6px 18px rgba(18,40,58,.07);
 }
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{height:100%}
 body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
 h1,h2,h3,.display{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.01em}
 button{font:inherit;cursor:pointer;border:none;background:none}
 input,select,textarea{font:inherit;color:var(--ink);font-size:16px}
 .num{font-variant-numeric:tabular-nums}

 /* ---------- layout ---------- */
 .topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 22px}
 .logo{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--ink)}
 .logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-family:Georgia,serif}
 .topbar .spacer{flex:1}
 .lang-toggle{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--paper)}
 .lang-toggle button{padding:5px 14px;font-size:13px;font-weight:600;color:var(--ink-soft)}
 .lang-toggle button.on{background:var(--ink);color:#fff}
 .link-btn{color:var(--ink-soft);font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:8px}
 .link-btn:hover{background:var(--paper)}
 main{max-width:1120px;margin:0 auto;padding:28px 22px 80px}

 /* ---------- buttons ---------- */
 .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;transition:.15s;min-height:44px}
 .btn-primary{background:var(--teal);color:#fff}
 .btn-primary:hover{background:var(--teal-dark)}
 .btn-ghost{border:1px solid var(--line);background:var(--card);color:var(--ink)}
 .btn-ghost:hover{border-color:var(--ink-soft)}
 .btn-amber{background:var(--ink);color:#fff}
 .btn-amber:hover{background:#1d3a52}
 .btn[disabled]{opacity:.5;cursor:not-allowed}
 .btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}

 /* ---------- login ---------- */
 .login-wrap{min-height:calc(100vh - 53px);display:flex;align-items:center;justify-content:center;padding:24px}
 .login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);width:400px;max-width:100%;padding:38px 36px}
 .login-card h1{font-size:26px;margin:14px 0 6px}
 .login-card p.sub{color:var(--ink-soft);font-size:14px;margin-bottom:24px}
 .field{margin-bottom:16px}
 .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
 .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:.15s}
 .field input[type="checkbox"],.field input[type="radio"]{width:auto;flex:none;padding:0}
 .field-jump-highlight{outline:3px solid var(--red)!important;outline-offset:2px;animation:field-jump-pulse 2s ease-out}
 @keyframes field-jump-pulse{0%{box-shadow:0 0 0 6px rgba(178,58,58,.25)}100%{box-shadow:0 0 0 0 rgba(178,58,58,0)}}
 .search-popover{position:absolute;top:28px;right:0;width:320px;max-width:90vw;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px;z-index:50;text-align:left}
 .search-popover input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:6px}
 .search-results-list{list-style:none;margin:0;padding:0;max-height:280px;overflow-y:auto}
 .search-results-list li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600}
 .search-results-list li:hover{background:var(--paper-soft)}
 .search-result-hint{font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.35}
 .search-result-category-note{color:var(--teal);font-weight:600}
 .zeile-row{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
 .zeile-num{flex:0 0 auto;min-width:34px;font-weight:700;color:var(--teal-dark);font-size:13px;background:var(--teal-soft);border-radius:6px;padding:2px 6px;text-align:center}
 .zeile-row .field{flex:1;margin-bottom:0}
 .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
 .field.req-empty input,.field.req-empty select{background:var(--amber-soft);border-color:var(--amber)}
 .field.req-empty input:focus,.field.req-empty select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
 .field .hint{font-size:12px;color:var(--ink-soft);margin-top:4px}
 .fa-dropdown{position:absolute;top:100%;left:0;right:0;z-index:50;background:#fff;
 border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
 max-height:260px;overflow-y:auto;margin-top:4px}
 .fa-option{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;
 align-items:center;gap:10px;font-size:13.5px;border-bottom:1px solid var(--paper)}
 .fa-option:last-child{border-bottom:none}
 .fa-option:hover{background:var(--paper)}
 .fa-option b{font-weight:600;color:var(--ink)}
 .fa-option span{color:var(--ink-soft);font-size:12px;white-space:nowrap}
 .demo-note{margin-top:18px;font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
 .auth-tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0 20px;background:var(--paper)}
 .auth-tabs button{flex:1;padding:9px;font-weight:600;font-size:13.5px;color:var(--ink-soft)}
 .auth-tabs button.on{background:var(--ink);color:#fff}
 .auth-err{background:var(--red-soft);border:1px solid #EBC6BD;color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
 details.more{margin:10px 0;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:#FBFCFB}
 details.more summary{cursor:pointer;font-weight:800;font-size:11.5px;color:var(--teal);text-transform:uppercase;letter-spacing:.07em;user-select:none}
.badge-warn{color:var(--amber);font-size:11px;font-weight:800;vertical-align:middle;text-transform:none;letter-spacing:normal}
 details.more[open] summary{margin-bottom:12px}
 .infobox{background:var(--blue-soft);border:1px solid #CBD9E8;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;line-height:1.5;clear:both}
 .infobox .ib-row{margin:4px 0}
 .info-btn{float:right;font-size:17px;color:var(--teal);padding:2px 8px;border-radius:8px}
 .info-btn:hover{background:var(--teal-soft)}
 .info-btn-sm{font-size:13px;color:var(--teal);background:var(--teal-soft);border:none;border-radius:50%;
 width:16px;height:16px;line-height:16px;display:inline-flex;align-items:center;justify-content:center;
 cursor:pointer;margin-left:5px;vertical-align:middle;padding:0}
 .info-btn-sm:hover{background:var(--teal)}
 .info-btn-sm:hover{color:#fff}

 /* ---------- dashboard ---------- */
 .page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
 .page-head h1{font-size:28px}
 .page-head p{color:var(--ink-soft);font-size:14px}
 .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
 .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
 .stat .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
 .stat .v{font-family:Georgia,serif;font-size:28px;margin-top:4px}
 .stat .v.teal{color:var(--teal)}
 .toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
 .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px}
 .search input{border:none;outline:none;padding:10px 0;flex:1;background:transparent}
 .filter-sel{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card)}

 .client-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
 .client-table th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBFCFB}
 .client-table td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
 .client-table tr:last-child td{border-bottom:none}
 .client-table tbody tr{cursor:pointer;transition:.12s}
 .client-table tbody tr:hover{background:var(--teal-soft)}
 .avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-right:10px}
 .cname{font-weight:600}
 .csub{font-size:12.5px;color:var(--ink-soft)}
 .chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600}
 .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
 .chip.draft{background:var(--blue-soft);color:#3A5A7C}
 .chip.review{background:var(--amber-soft);color:var(--amber)}
 .chip.submitted{background:var(--teal-soft);color:var(--teal)}
 .refund-cell{font-weight:700}
 .refund-cell.pos{color:var(--teal)} .refund-cell.neg{color:var(--red)}
 .empty{padding:60px 20px;text-align:center;color:var(--ink-soft)}
 .empty .big{font-size:40px;margin-bottom:10px}

 /* ---------- workspace ---------- */
 .crumbs{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
 .crumbs a{color:var(--teal);cursor:pointer;text-decoration:none;font-weight:600}
 .ws{display:grid;grid-template-columns:210px 1fr 260px;gap:20px;align-items:start}
 .phase-group{margin-bottom:6px}
 .phase-group:last-child{margin-bottom:0}
 .phase-label{font-size:10.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;padding:10px 12px 4px}
 @media(max-width:980px){
 .ws{grid-template-columns:1fr}
 .steps{display:flex;overflow-x:auto;gap:14px;position:relative;
 mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 28px),transparent);
 -webkit-mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 28px),transparent)}
 .step-item{white-space:nowrap}
 .phase-group{display:flex;gap:4px;align-items:center;margin-bottom:0;flex-shrink:0}
 .phase-label{padding:0 6px 0 0;border-right:1px solid var(--line);margin-right:4px;white-space:nowrap}
 }
 .steps{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
 .step-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.12s}
 .step-item:hover{background:var(--paper)}
 .step-item.on{background:var(--ink);color:#fff}
 #busy-overlay{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:99999;
 display:flex;align-items:center;justify-content:center;cursor:wait}
 #busy-overlay .spinner{width:40px;height:40px;border:4px solid var(--line);
 border-top-color:var(--teal);border-radius:50%;animation:busy-spin .7s linear infinite}
 @keyframes busy-spin{to{transform:rotate(360deg)}}
 .btn.is-loading{opacity:.75;pointer-events:none;position:relative;color:transparent!important}
 .btn.is-loading::after{content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;
 margin:-8px 0 0 -8px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;
 border-radius:50%;animation:busy-spin .6s linear infinite}
 .btn-ghost.is-loading::after{border:2.5px solid rgba(0,0,0,.2);border-top-color:var(--ink)}
 .progress-bar-wrap{height:4px;background:var(--line);border-radius:2px;margin:0 0 18px;overflow:hidden}
 .progress-bar-fill{height:4px;background:var(--teal);border-radius:2px;transition:width .3s}
 .step-counter{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
 .step-item .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;flex:none}
 .step-item.done .n{background:var(--teal);border-color:var(--teal);color:#fff}
 .step-item.incomplete .n{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-weight:800}
 .step-item.incomplete{color:var(--amber)}
 .step-item.incomplete.on{color:#fff}
 .step-item.incomplete.on .n{background:var(--amber);border-color:var(--amber);color:#fff}
 .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px}
 .panel h2{font-size:21px;margin-bottom:4px}
 .panel .lead{color:var(--ink-soft);font-size:14px;margin-bottom:22px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
 .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px}
 @media(max-width:640px){
 .grid2,.grid3{grid-template-columns:1fr}
 /* Enlarge small tap targets to the 44px accessibility minimum on touch screens */
 .link-btn{padding:11px 14px;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
 .info-btn-sm{width:26px;height:26px;line-height:26px;font-size:14px}
 /* Header controls wrap onto a second row instead of overflowing off-screen */
 .topbar{flex-wrap:wrap;row-gap:8px;padding:10px 14px}
 .topbar .spacer{flex-basis:100%;height:0}
 /* Modal action rows stack full-width instead of squeezing side by side */
 .modal [style*="justify-content:flex-end"]{flex-wrap:wrap}
 .modal [style*="justify-content:flex-end"] .btn{flex:1;min-width:120px}
 .modal{padding:22px 18px}
 .login-card{padding:28px 22px}
 /* Dashboard stat cards and toolbar controls get more breathing room */
 .stats{grid-template-columns:1fr 1fr}
 .search{min-width:0}
 }
 @media(max-width:400px){
 .stats{grid-template-columns:1fr}
 }
 .section-label{font-size:12px;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
 .section-label:first-of-type{margin-top:0;padding-top:0;border-top:none}
 .nav-row{display:flex;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
 .warn{background:var(--amber-soft);border:1px solid #F0D9AE;color:#7A5410;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:14px}

 /* refund meter - signature element */
 .meter{background:linear-gradient(160deg,#12283A,#1B3A52);color:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:sticky;top:74px}
 .meter .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#9FC1B8}
 .meter .big{font-family:Georgia,serif;font-size:34px;margin:8px 0 2px;color:#7FD8BE}
 .meter .big.neg{color:#F2A78F}
 .meter .sub{font-size:12px;color:#B9CBD9}
 .meter hr{border:none;border-top:1px solid rgba(255,255,255,.14);margin:16px 0}
 .meter .row{display:flex;justify-content:space-between;font-size:12.5px;color:#D6E2EC;padding:3px 0}
 .meter .row b{color:#fff;font-weight:600}
 .meter .foot{margin-top:14px;font-size:11px;color:#8FA6B8;line-height:1.45}

 /* upload */
 .dropzone{border:2px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--ink-soft);background:#FBFCFB;transition:.15s;cursor:pointer}
 .dropzone:hover,.dropzone.drag{border-color:var(--teal);background:var(--teal-soft)}
 .dropzone .icon{font-size:34px;margin-bottom:8px}
 .dropzone b{color:var(--ink)}
 .scan-status{display:flex;align-items:center;gap:12px;background:var(--blue-soft);border-radius:10px;padding:12px 16px;margin-top:14px;font-size:14px}
 .spinner{width:18px;height:18px;border:2.5px solid #B9CBD9;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;flex:none}
 @keyframes spin{to{transform:rotate(360deg)}}
 .extract-ok{background:var(--teal-soft);border:1px solid #BEE0D4;color:var(--teal-dark);border-radius:10px;padding:12px 16px;margin-top:14px;font-size:13.5px}
 .extract-err{background:var(--red-soft);border:1px solid #EBC6BD;color:var(--red);border-radius:10px;padding:12px 16px;margin-top:14px;font-size:13.5px}
 .ai-flag{display:inline-block;background:var(--amber-soft);color:var(--amber);font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:6px;letter-spacing:.03em;vertical-align:middle}

 /* summary */
 .sum-group{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
 .sum-group .head{display:flex;justify-content:space-between;align-items:center;background:#FBFCFB;padding:10px 16px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
 .sum-group .head .edit{color:var(--teal);font-size:12.5px;font-weight:700;cursor:pointer}
 .sum-row{display:flex;justify-content:space-between;gap:16px;padding:8px 16px;font-size:13.5px;border-bottom:1px solid #F0F4F2}
 .sum-row:last-child{border-bottom:none}
 .sum-row .l{color:var(--ink-soft)} .sum-row .r{font-weight:600;text-align:right}

 /* modal */
 .modal-bg{position:fixed;inset:0;background:rgba(18,40,58,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
 .modal{background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:480px;max-width:100%;max-height:90vh;overflow:auto;padding:30px}
 .modal h2{font-size:21px;margin-bottom:6px}
 .success-mark{width:58px;height:58px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px}
 .ticket{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;font-family:ui-monospace,Consolas,monospace;font-size:14px;text-align:center;margin:14px 0;letter-spacing:.04em}
 .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:200;animation:fadeup .3s}
 @keyframes fadeup{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
 .hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
<input type="file" id="docInput" accept="image/*,application/pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple class="hidden">

<script>
/* =====================================================================
 SimplyTax - Phase 1 (admin-only)
 English default · German toggle · in-memory + persistent storage
===================================================================== */

/* =====================================================================
 BACKEND TOGGLE - set enabled:true and your API URL to use the PostgreSQL
 backend (see /backend). false = local/browser storage only (current mode).
===================================================================== */
const BACKEND = { enabled:true, baseUrl:'__BACKEND_URL__' }; // ← Replaced automatically at deploy time by the GitHub Actions workflow (.github/workflows/deploy.yml) based on which branch triggered the build - never edit this value directly, edit the workflow's own URLs instead if a Render URL ever changes
/* DISCOUNT CODES - edit this list to add/remove promo codes. type:'percent' (0-100) or 'fixed' (EUR off).
 Client-side table is used for the 'simulated' payment mode; for real Stripe payments the SAME codes
 must also exist in backend/server.js (DISCOUNTS) since the server is the source of truth for the
 actual amount charged - never trust a client-computed discount for a real payment. */
const DISCOUNTS = {
 WELCOME10:{ type:'percent', value:10 },
 SAVE5:{ type:'fixed', value:5 }
};
function computeDiscount(code, price){
 const d = DISCOUNTS[String(code||'').trim().toUpperCase()];
 if(!d) return null;
 const off = d.type==='percent' ? price*d.value/100 : d.value;
 const final = Math.max(0, Math.round((price-off)*100)/100);
 return { code:String(code).trim().toUpperCase(), off:Math.round((price-final)*100)/100, final };
}

 PDF download + ELSTER submission PER RETURN. Prototype simulates the payment;
 production connects Stripe Checkout via the backend (see production checklist). */

 enabled:false,
 provider:'simulated', // 'simulated' | 'stripe_link' (no backend needed) | 'stripe_backend' (with Supabase/API)

 pricePerReturn:17.99, currency:'EUR'

async function payNow(btn){
 const c=cur(); if(!c) return;
 const discountCode = c.pay && c.pay.discountCode;
 /* Level B: full Checkout via backend + webhook (tamper-proof) */
 if(PAYMENT.provider==='stripe_backend' && BACKEND.enabled){
 setBtnBusy(btn,true);
 try{ const r=await api('/api/payments/checkout','POST',{clientId:c.id, discountCode}); location.href=r.url; }
 catch(e){ setBtnBusy(btn,false); alert('Stripe: '+e.message); }
 return;
 }
 /* Level A: Stripe Payment Link - works without a backend (beta-grade unlock) */
 if(PAYMENT.provider==='stripe_link' && PAYMENT.paymentLink && !PAYMENT.paymentLink.includes('REPLACE_ME')){
 /* Payment Links have a fixed price; discount codes for this mode must be configured as
 Stripe "Promotion codes" in the Dashboard (Payment Link settings -> Allow promotion codes)
 so Stripe applies them at its own checkout screen - this app cannot change a Link's price. */
 await kvSet('klarsteuer-pending-pay', c.id);
 location.href = PAYMENT.paymentLink + (PAYMENT.paymentLink.includes('?')?'&':'?')
 + 'client_reference_id=' + encodeURIComponent(c.id);
 return;
 }
 /* simulated (prototype) - apply the client-side discount table */
 const d = discountCode ? computeDiscount(discountCode, PAYMENT.pricePerReturn) : null;
 c.pay={ status:'paid', paidAt:Date.now(), amount:d?d.final:PAYMENT.pricePerReturn,
 discountCode:d?d.code:null, discountOff:d?d.off:0,
 txId:'PAY-'+Math.random().toString(36).slice(2,8).toUpperCase() };
 c.updatedAt=Date.now(); scheduleSave();
 const m=document.querySelector('.modal-bg'); if(m) m.remove();
 render();
}
/* on return from Stripe (success_url contains ?session_id=...) */
async function handleStripeReturn(){
 let qs=null; try{ qs=new URLSearchParams(location.search); }catch(e){ return; }
 const sid=qs && qs.get('session_id'); if(!sid) return;
 try{
 if(PAYMENT.provider==='stripe_backend' && BACKEND.enabled){
 const r=await api('/api/payments/verify','POST',{sessionId:sid});
 const c=S.clients.find(x=>x.id===r.clientId);
 if(r.paid && c){ c.pay={status:'paid',paidAt:Date.now(),amount:PAYMENT.pricePerReturn,txId:sid.slice(0,24)}; scheduleSave(); }
 } else if(PAYMENT.provider==='stripe_link'){
 const pend=await kvGet('klarsteuer-pending-pay');
 const c=S.clients.find(x=>x.id===pend);
 if(c){ c.pay={status:'paid',paidAt:Date.now(),amount:PAYMENT.pricePerReturn,txId:sid.slice(0,24)}; scheduleSave(); }
 await kvDel('klarsteuer-pending-pay');
 }
 }catch(e){ console.error('stripe return:', e.message); }
 try{ history.replaceState({},'',location.pathname); }catch(e){}
}
let authToken = null;
let tokenRefreshTimer = null;
/* IMPLEMENTED: wires the frontend to the new backend refresh endpoint,
   addressing the real trade-off of shortening the session token
   lifetime from 12 hours to 2 (see server.js sign()) - without this,
   someone in the middle of a long tax return would be logged out
   mid-session. Called from every place a valid session is
   established (restored on load, fresh login, fresh registration).
   Refreshes well within the 2-hour window, with enough margin that a
   single failed attempt (a brief network hiccup) doesn't risk
   anything - the next scheduled attempt, or any regular API call,
   would still succeed or naturally reveal a genuinely expired session
   via the existing 401 handling, without this needing its own special
   error/logout logic. */
function startTokenRefreshTimer(){
 if(tokenRefreshTimer) clearInterval(tokenRefreshTimer);
 tokenRefreshTimer = setInterval(async () => {
 if(!S.loggedIn || !BACKEND.enabled) return;
  try{ const r = await api('/api/auth/refresh','POST'); authToken = r.token; }
 catch(e){ /* best-effort - see comment above */ }
 }, 30*60*1000); // every 30 minutes, well within the 2-hour token window
}
async function api(path, method='GET', body){
 const r = await fetch(BACKEND.baseUrl+path, {
 method,
 credentials: 'include',
 headers:{ 'Content-Type':'application/json', ...(authToken?{Authorization:'Bearer '+authToken}:{}) },
 body: body?JSON.stringify(body):undefined });
 const data = await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(data.error || ('HTTP '+r.status));
 return data;
}

function reminderPanel(cs){
 const stale = cs.filter(c=>isPaid(c)&&c.status!=='submitted')
 .map(c=>({c, days: Math.floor((Date.now()-(c.pay.paidAt||Date.now()))/86400000)}))
 .sort((a,b)=>b.days-a.days);
 if(!stale.length) return '';
 return `<div class="infobox" style="margin-top:-6px;margin-bottom:20px;border-color:var(--amber);background:var(--amber-soft)">
 <b>🔔 ${t('paid_not_submitted')}</b> - ${t('reminder_lead')}
 <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
 ${stale.map(({c,days})=>`<div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:8px;padding:8px 12px;font-size:13.5px">
 <span onclick="openClient('${c.id}')" style="cursor:pointer;font-weight:600;color:var(--ink)">${esc(c.p.firstName+' '+c.p.lastName)} · ${c.taxYear}</span>
 <span class="chip ${days>=14?'':'review'}" style="${days>=14?'background:var(--red-soft);color:var(--red)':''}">${days} ${t('days_since_payment')}${days>=14?' - '+t('refund_window_over'):''}</span>
 </div>`).join('')}
 </div>
 </div>`;
}

/* ---------------- persistence & accounts (artifact storage with fallback) ---------------- */
const mem={};
/* storage layers: Claude artifact storage → browser localStorage (e.g. GitHub Pages) → in-memory */
async function kvGet(k){
 try{ if(window.storage){ const r=await window.storage.get(k); if(r && r.value!=null) return r.value; } }catch(e){}
 try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
 return mem[k]??null;
}
async function kvSet(k,v){
 try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
 try{ localStorage.setItem(k,v); return; }catch(e){}
 mem[k]=v;
}
async function kvDel(k){
 try{ if(window.storage){ await window.storage.delete(k); } }catch(e){}
 try{ localStorage.removeItem(k); }catch(e){}
 delete mem[k];
}

 try{

 if(r.blockedIds?.length && !S._blockedEditWarned) S._blockedEditWarned = new Set();
 if(r.blockedIds?.length){

 if(newlyBlocked.length && newlyBlocked.includes(S.currentId) && !document.querySelector('.modal-bg')){

 }
 catch(e){
 /* IMPLEMENTED: real, confirmed gap directly relevant to a reported
    bug - a failed save was only ever logged to the browser's own
    developer console, completely invisible to a real user. If a
    save fails for any reason (an expired session, a blocked
    cross-site cookie, a network issue), the person previously saw
    no indication their work wasn't actually persisted - it looked
    like it worked, then silently vanished on the next load. Now
    surfaces a real, visible warning instead, distinguishing an auth
    failure (likely a session or cookie problem) from a general one,
    since that's the most useful diagnostic information available.
    Only warned once per session, not on every failed autosave tick,
    so a genuine connectivity problem doesn't spam the person with
    repeated identical alerts. */
 console.error('backend sync failed:', e.message);
 if(!S._saveFailWarned && !document.querySelector('.modal-bg')){
 S._saveFailWarned = true;
 const isAuthError = e.message === 'auth_required' || e.message === 'invalid_token';
 showInfoModal(isAuthError ? t('save_failed_auth') : t('save_failed_generic'));

 await kvSet('klarsteuer-data-'+S.user.id, JSON.stringify({clients:S.clients}));

/* ---------------- authentication (prototype - production uses server-side auth + 2FA) ---------------- */
async function hashPass(email,pass){
 try{
 const data=new TextEncoder().encode(email.toLowerCase()+'::'+pass);
 const buf=await crypto.subtle.digest('SHA-256',data);
 return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
 }catch(e){ return 'b64:'+btoa(unescape(encodeURIComponent(email.toLowerCase()+'::'+pass))); }
}
function authErr(msg){ const el=document.getElementById('auth-err'); if(el){ el.textContent=msg; el.classList.remove('hidden'); el.style.background=''; el.style.color=''; el.style.borderColor=''; } }
function authOk(msg){ const el=document.getElementById('auth-err'); if(el){ el.textContent=msg; el.classList.remove('hidden'); el.style.background='var(--teal-soft)'; el.style.color='var(--teal-dark)'; el.style.borderColor='var(--teal)'; } }

async function doLogin(btn){
 const email=(document.getElementById('lg-email')?.value||'').trim().toLowerCase();
 const pass=document.getElementById('lg-pass')?.value||'';
 if(!email||!pass){ authErr(t('err_fields')); return; }
 setBusy(true); setBtnBusy(btn,true);
 try{
 if(BACKEND.enabled){
   try{ const r=await api('/api/auth/login','POST',{email,password:pass});
  S.user=r.user;
  /* IMPLEMENTED: real, confirmed fix for a directly-evidenced bug -
     login succeeds and shows real user data, but the very next
     request (loading actual tax return data) fails with an auth
     error. Confirmed cause: some browsers, most notably every browser
     on iOS (all required by Apple to share Safari's own engine and
     its aggressive cross-site cookie blocking), never actually store
     or send back the session cookie at all, even though the login
     response itself succeeds and sets it. The backend already
     accepts a Bearer token as a fallback for exactly this reason -
     but authToken was declared and never actually set anywhere,
     meaning that fallback had no way to ever be used. Set here,
     kept in memory only for this tab's lifetime - deliberately never
     written to localStorage or any persistent storage, since that
     would reintroduce the real XSS exposure the cookie migration
     existed to remove. This fixes things within an active session;
     a hard refresh on a cookie-blocked browser still requires
     signing in again, since there's nothing persisted to restore -
     an honest, deliberate trade-off, not an oversight. */
  authToken = r.token;
 await loadUserData(); S.loggedIn=true; S.view='dash'; startTokenRefreshTimer(); render();
 }catch(e){ authErr(e.message==='bad_credentials'?t('err_creds'):t('err_creds')); }
 return;
 }
 const h=await hashPass(email,pass);
 const u=S.accounts.find(a=>a.email===email && a.passHash===h);
 if(!u){ authErr(t('err_creds')); return; }
 S.user=u; await kvSet('klarsteuer-session',u.id);
 await loadUserData(); S.loggedIn=true; S.view='dash'; render();
 } finally { setBusy(false); setBtnBusy(btn,false); }
}

async function logout(){
 if(tokenRefreshTimer){ clearInterval(tokenRefreshTimer); tokenRefreshTimer=null; }
 /* CORRECTED: real, confirmed bug directly reported by a user - logout
    was genuinely slow because this call was awaited, meaning the
    whole logout waited for the network request to settle before
    showing the login screen. The comment here already said a
    failure shouldn't block anyone, and that was true (a failure is
    caught) - but a slow request still blocked everything regardless,
    since await waits for the promise to settle either way, not just
    on success. This backend runs on a hosting tier that genuinely
    spins down after inactivity and can take real, noticeable time to
    wake back up on its next request - logout could easily be that
    first request after a while of inactivity. Fired without waiting
    for it now: the actual, visible logout (clearing state, showing
    the login screen) is instant, while the best-effort server-side
    cookie clear happens in the background regardless of how long it
    takes or whether it succeeds - the security cookie was httpOnly
    specifically so JavaScript can't clear it directly, so this
    server-side request is still worth making, just not worth making
    anyone wait for. */
 if(BACKEND.enabled){ api('/api/auth/logout','POST').catch(()=>{}); }
 await kvDel('klarsteuer-session');
 S.user=null; S.clients=[]; S.loggedIn=false; S.view='login'; S.authMode='login'; render();
}

function stMsg(msg, ok){
 const el=document.getElementById('st-msg'); if(!el) return;
 el.textContent=msg; el.classList.remove('hidden');
 el.style.background = ok ? 'var(--teal-soft)' : 'var(--red-soft)';
 el.style.color = ok ? 'var(--teal-dark)' : 'var(--red)';
}
async function doChangeEmail(btn){
 const email=(document.getElementById('st-email-new')?.value||'').trim().toLowerCase();
 const pass=document.getElementById('st-email-pass')?.value||'';
 if(!email || !pass){ stMsg(t('err_fields'), false); return; }

 setBtnBusy(btn,true);
 try{

 stMsg(t('email_changed'), true);

/* IMPLEMENTED: addresses a real, direct gap from the production audit
   ("I did not find a complete user-facing 'Delete my account'
   workflow"). Genuinely mirrors the existing "delete tax return"
   confirmation pattern for consistency - password check first, then
   an explicit second confirmation before anything irreversible
   happens, since deleting the whole account is a strictly bigger
   action than deleting one return. */
/* IMPLEMENTED: addresses a real gap the audit flagged directly under
   its "Data subject controls are missing" finding - "download my
   information" was listed as absent. Triggers a real file download of
   the complete data bundle, using the same download-a-Blob pattern
   already used elsewhere in this app (exportElster) for consistency. */
async function doExportData(btn){
 const pass=document.getElementById('st-export-pass')?.value||'';
 if(!pass){ stMsg(t('err_fields'), false); return; }
 setBtnBusy(btn,true);
 try{
 const data = await api('/api/auth/export','POST',{password:pass});
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
 a.download=`simplytax_my_data_${new Date().toISOString().slice(0,10)}.json`;
 document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
 const f=document.getElementById('st-export-pass'); if(f) f.value='';
 stMsg(t('export_data_done'), true);
 }catch(e){
 stMsg(e && e.message==='wrong_password' ? t('err_wrong_pass') : t('err_creds'), false);
 }finally{
 setBtnBusy(btn,false);
 }
}
function confirmDeleteAccount(){
 const pass=document.getElementById('st-del-pass')?.value||'';
 if(!pass){ stMsg(t('err_fields'), false); return; }
 /* Stashed here rather than passed through the onclick string below -
    the original input field is removed from the DOM once this
    confirmation modal replaces it, and a password could contain
    characters (quotes) that would break out of an inline attribute. */
 S._deleteAccountPending = pass;
 const slot=document.getElementById('modal-slot'); if(!slot) return;
 slot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="modal" style="max-width:440px">
 <h2>🗑 ${t('confirm_del_account_title')}</h2>
 <p style="color:var(--ink-soft);font-size:13.5px;margin:10px 0 14px">${t('confirm_del_account_body')}</p>
 <div class="infobox" style="background:var(--red-soft);border-color:var(--red);font-size:12.5px;margin-bottom:16px">⚠ ${t('confirm_del_account_permanent')}</div>
 <div style="display:flex;gap:10px;justify-content:flex-end">
 <button class="btn btn-ghost" onclick="this.closest('.modal-bg').remove()">${t('cancel')}</button>
 <button class="btn" style="background:var(--red);border-color:var(--red)" onclick="doDeleteAccount(this)">🗑 ${t('confirm_del_action')}</button>
 </div>
 </div></div>`;
}
async function doDeleteAccount(btn){
 const pass=S._deleteAccountPending; S._deleteAccountPending=null;
 setBtnBusy(btn,true);
 try{
 await api('/api/auth/account','DELETE',{password:pass});
 const m=document.querySelector('.modal-bg'); if(m) m.remove();
 await logout();
 /* IMPLEMENTED: real, confirmed gap directly matching a reported
    symptom - no confirmation was ever shown after a successful
    deletion, the flow just silently redirected to the login screen.
    Shown after logout() completes, not before - modal-slot only
    exists once render() has actually run at least once, the same
    startup-timing lesson already learned elsewhere in this file. */
 showInfoModal(t('delete_account_success'));
 }catch(e){
 setBtnBusy(btn,false);
 const m=document.querySelector('.modal-bg'); if(m) m.remove();
 /* CORRECTED: real, confirmed gap - any failure that wasn't
    specifically wrong_password (a server error, a network issue, or
    now the deletion_failed response the backend's own transaction
    fix can genuinely return) fell through to a generic "wrong
    credentials" message, which is directly misleading when the
    password was never the actual problem. */
 stMsg(e && e.message==='wrong_password' ? t('err_wrong_pass') : t('delete_account_failed'), false);
 }
}

/* ---------------- number & format helpers ---------------- */
const N = v => {
 let s = String(v??'').trim().replace(/[€\s]/g,'');
 if(!s) return 0;
 const hasC = s.includes(','), hasD = s.includes('.');
 if(hasC && hasD){
 // last separator wins as decimal: "1.234,56" → German · "1,234.56" → English
 if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
 else s = s.replace(/,/g,'');
 } else if(hasC){ s = s.replace(',','.'); } // "1234,56" → German decimal
 else if(hasD){
 const p = s.split('.');
 if(!(p.length===2 && p[1].length<=2 && p[1].length>0)) s = s.replace(/\./g,''); // "1.234" → thousands, "45000.5" → decimal
 }
 const n = parseFloat(s); return Number.isFinite(n)?n:0;
};
/* Shared everywhere the old single p.costs field used to be referenced -
   now sums the five real itemized categories instead of one combined
   total, confirmed against the real ERiC schema. */
function propCosts(p){ return N(p.wkAfa)+N(p.wkSonderabschr)+N(p.wkSchuldzins)+N(p.wkGeldbeschaff)+N(p.wkErhaltung)+N(p.wk5JAbzugsfaehig)+N(p.wkVerwaltung)+N(p.wkUstPflichtig)+N(p.wkSonst); }
function formatDE(n){
 /* CORRECTED: real bug found via direct feedback - checked every call
    site of this function (five of them, all input-field commit
    handlers, none a read-only summary display) and confirmed none of
    them should ever drop the decimals for a whole number. Entering
    "10" produced "10" instead of "10,00", not matching the "0,00 €"
    placeholder every one of these fields shows. Always showing 2
    decimals matches what every field actually promises. */
 return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
}
function eur(n){ return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Math.round(n)); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dateStr(ts){ return new Date(ts).toLocaleDateString(S.lang==='de'?'de-DE':'en-GB'); }

/* ---------------- tax engine (§32a EStG, simplified estimate) ---------------- */
/* § 32a parameters per year; 2026 falls back to 2025 until the 2026 tariff is enacted */
const TARIFF = {
 2023:{gfb:10908, z1e:15999, a1:979.18, z2e:62809, a2:192.59, c2:966.53, z3e:277825, r3:.42, d3:9972.98, r4:.45, d4:18307.73},
 2024:{gfb:11784, z1e:17005, a1:954.80, z2e:66760, a2:181.19, c2:991.21, z3e:277825, r3:.42, d3:10636.31, r4:.45, d4:18971.06},
 2025:{gfb:12096, z1e:17443, a1:932.30, z2e:68480, a2:176.64, c2:1015.13, z3e:277825, r3:.42, d3:10911.92, r4:.45, d4:19246.67},
};
function estBase(zvE, year){
 const T = TARIFF[year] || TARIFF[2025]; const x = Math.floor(zvE);
 if(x <= T.gfb) return 0;
 if(x <= T.z1e){ const y=(x-T.gfb)/10000; return Math.floor((T.a1*y+1400)*y); }
 if(x <= T.z2e){ const z=(x-T.z1e)/10000; return Math.floor((T.a2*z+2397)*z+T.c2); }
 if(x <= T.z3e) return Math.floor(T.r3*x - T.d3);
 return Math.floor(T.r4*x - T.d4);
}
function incTotals(c){
 return (c.emps||[]).reduce((a,e)=>{
 a.gross+=N(e.gross);
 a.wageTax+=N(e.wageTax); a.soli+=N(e.soli); a.church+=N(e.churchPaid);
 a.paid+=N(e.wageTax)+N(e.soli)+N(e.churchPaid)+N(e.churchSpouse)+N(e.lst11)+N(e.soli12)+N(e.kist13)+N(e.kistSp14);
 a.kistSA+=N(e.churchPaid)+N(e.churchSpouse)+N(e.kist13)+N(e.kistSp14); // § 10 (1) Nr. 4: paid KiSt is a Sonderausgabe (not line 45)
 a.ersatz+=N(e.ersatz15); // Progressionsvorbehalt (line 15)
 const isB=e.person==='B';
 a[isB?'fahrtB':'fahrtA']+=N(e.fahrt17)+N(e.pausch18); // reduces Entfernungspauschale (lines 17/18), per person
 /* CORRECTED: real, confirmed gap found via direct follow-up after
    the systematic §26a audit - these fields were summed across both
    people regardless of person, unlike fahrtA/B and avA/B right next
    to them, which were already correctly split. Now split the same
    way, so each person's own contributions can genuinely be sent on
    their own return under separate assessment, and so a joint return
    can still show both people's real, individual contributions. */
 a[isB?'rvB':'rvA']+=N(e.anRV)+N(e.anRVb); a[isB?'kvB':'kvA']+=N(e.anKV); a[isB?'pvB':'pvA']+=N(e.anPV); a[isB?'avB':'avA']+=N(e.anAV); a[isB?'pkvB':'pkvA']+=N(e.pkv28);
 a[isB?'agKVB':'agKVA']+=N(e.agKV); a[isB?'agPKVB':'agPKVA']+=N(e.agPKV); a[isB?'agPVB':'agPVA']+=N(e.agPV); // tax-free employer subsidies (lines 24a/b/c) reduce the deductible amounts
 /* CORRECTED: real, confirmed gap found via a full wiring audit -
    the employer's own pension contribution (Zeile 22a) was collected
    per employer but never summed here, so it never reached the real
    field the schema genuinely has for it (AVor's Arbeitgeberanteil).
    Note this is genuinely different from agKV/agPKV/agPV just above -
    checked the real schema directly and confirmed there is no
    equivalent employer-portion field for health/care insurance, only
    for the pension contribution specifically. */
 a[isB?'agRVB':'agRVA']+=N(e.agRV)+N(e.agRVb);
 return a; },
 {gross:0,wageTax:0,soli:0,church:0,paid:0,kistSA:0,ersatz:0,fahrtA:0,fahrtB:0,
 rvA:0,rvB:0,kvA:0,kvB:0,pvA:0,pvB:0,avA:0,avB:0,pkvA:0,pkvB:0,agKVA:0,agKVB:0,agPKVA:0,agPKVB:0,agPVA:0,agPVB:0,agRVA:0,agRVB:0});
}
// Anlage R: taxable share by start year (§ 22 incl. WtChG: 2005=50%, +2pp to 2020, +1pp to 2022, +0.5pp after)
// Shared at top level (not local to computeEstimate) so buildElsterDataset uses the EXACT same
// formula when exporting for ERiC - avoids two copies of this drifting apart.
const rentePct = sy => { sy=parseInt(sy)||2005;
 if(sy<=2005) return 50; if(sy<=2020) return 50+2*(sy-2005);
 if(sy<=2022) return 80+(sy-2020); return Math.min(100, 82+0.5*(sy-2022)); };

function computeEstimate(c){
 /* CORRECTED: real, significant bug found via direct user report - for
    married_sep (§26a separate assessment), this function was always
    using the full, unhalved shared household amounts (donations,
    medical costs, childcare, etc.) even though each spouse's actual,
    real return can only claim their own agreed share. The comparison
    card's own "separate" figure already computed this correctly via
    computeEstimatePerPerson - this was two genuinely different
    calculations for what should be the same real filing status.
    Redirects to that already-proven function so every caller of
    computeEstimate gets the correct, consistent number. Safe against
    infinite recursion: computeEstimatePerPerson clones with marital
    forced to 'single' before calling back in, so this condition never
    re-triggers on the inner call. */
 if (c.p.marital === 'married_sep') return computeEstimatePerPerson(c, 'A');
 const year = c.taxYear || 2025;
 const inc = incTotals(c);
 const gross = inc.gross;
 const joint = c.p.marital==='married'; // true ONLY for actual Zusammenveranlagung (doubles GFB, SA-Pauschbetrag, Vorsorge caps, Soli-Freigrenze, etc.)
 // § 32a Abs. 6 Nr. 1 EStG - Witwensplitting/Gnadensplitting: in the ASSESSMENT YEAR
 // immediately following the spouse's death, the splitting TARIFF (rate schedule) still
 // applies to the surviving spouse's own income - but NONE of the other "joint" doublings
 // (no second income, no doubled allowances). Deliberately kept separate from `joint`.
 const widowSplitYear = c.p.marital==='verwitwet' && parseInt(c.p.deathYear||0)===year-1;
 const useSplitTariff = joint || widowSplitYear;
 // Werbungskosten per person: €1,230 lump sum each (if employed) OR actual costs, per person
 const calcWK = (w,fCredit)=>{ w=w||{};
 const days=Math.min(N(w.commuteDays),366), km=N(w.commuteKm);
 /* CORRECTED: real gap found via direct request - checked the actual
    Anlage N form structure and multiple independent tax-law sources.
    Two real things were missing before this fix:
    1) The flat per-km rate itself changed for the 2026 tax year -
       the historic 20km tiered split (0,30€ first 20km, 0,38€ beyond)
       is gone; 2026+ uses a flat 0,38€/km from the first kilometer.
       Confirmed via two independent sources during research, not
       ERiC-verified directly (no schema access this session) - worth
       a real double-check against the official BMF rate table once
       that's available again, but the year-based split itself is
       applied here regardless, since the general shape of the rule
       (a rate change effective 2026) is solidly corroborated.
    2) The real €4,500/year cap only applies to non-car commutes -
       car travel (own or company car) is completely uncapped. Public
       transport additionally has its own exception: if actual ticket
       costs for the year exceed what the capped flat-rate calculation
       gives, the higher actual cost can be claimed instead. Bike,
       foot, motorcycle, and carpool get the flat-rate calculation,
       capped, with no actual-cost alternative - only public transport
       has that specific exception. */
 const kmRate = k => year>=2026 ? k*0.38 : (Math.min(k,20)*0.30 + Math.max(k-20,0)*0.38);
 const commuteFlatRate = Math.max(0, days*kmRate(km) - (fCredit||0));
 const isCar = w.commuteMode === 'car';
 let commute = isCar ? commuteFlatRate : Math.min(commuteFlatRate, 4500);
 if(!isCar && w.commuteMode==='public' && N(w.commutePublicCost) > commute) commute = N(w.commutePublicCost);
 const ho=Math.min(N(w.homeOffice)*6,1260);
 const dhhRent=Math.min(N(w.dhhRent),1000)*Math.min(N(w.dhhMonths),12);
 const dhhTrips=Math.min(N(w.dhhTrips),52)*kmRate(N(w.dhhKm));
 return commute+ho+N(w.equipment)+N(w.training)+N(w.other)+N(w.arbeitszimmer)+dhhRent+dhhTrips+N(w.relocation); };
 const employedB = joint && (c.emps||[]).some(x=>x.person==='B' && N(x.gross)>0);
 const employedA = (c.emps||[]).some(x=>N(x.gross)>0 && (!joint || x.person!=='B'));
 const itemsA = (c.wkItems||[]).filter(x=>!joint || x.person!=='B').reduce((a,x)=>a+N(x.amount),0);
 const itemsB = joint ? (c.wkItems||[]).filter(x=>x.person==='B').reduce((a,x)=>a+N(x.amount),0) : 0;
 const costsA = calcWK(c.wk, inc.fahrtA + (joint?0:inc.fahrtB)) + itemsA;
 const costsB = joint ? calcWK(c.wkB, inc.fahrtB) + itemsB : 0;
 const wk = (employedA ? Math.max(1230,costsA) : costsA)
 + (joint ? (employedB ? Math.max(1230,costsB) : costsB) : 0);
 // private insurances by tax category AND person (caps apply per person)
 const pins=(c.privIns||[]).reduce((a,x)=>{
 const net=Math.max(0, N(x.beitrag)-N(x.erstattung));
 const cat=INS_CAT[x.type]||'vorsorge';
 const per=(joint && x.person==='B')?'B':'A';
 a[per][cat]+=net; a.total+=net; return a;
 },{total:0,A:{basis:0,alters:0,riester:0,vorsorge:0,none:0},B:{basis:0,alters:0,riester:0,vorsorge:0,none:0}});
 // § 10 Abs. 1 Nr. 3/3a + Abs. 4 EStG, per person:
 // Basis (KV minus subsidy, ×0.96 Krankengeld cut; PV minus subsidy; PKV minus subsidy) is ALWAYS fully deductible.
 // The €1,900 cap (€2,800 without subsidized coverage) covers Basis + sonstige Vorsorge TOGETHER,
 // so sonstige (AV, Haftpflicht, BU...) only add anything while Basis < cap (§ 10 Abs. 4 S. 4).
 const svBasisPerson = per => (c.emps||[]).filter(e=>(e.person==='B')===(per==='B')).reduce((a,e)=>
 a + Math.max(0, N(e.anKV)-N(e.agKV))*0.96
 + Math.max(0, N(e.anPV)-N(e.agPV))
 + Math.max(0, N(e.pkv28)-N(e.agPKV)), 0);
 const basisA = svBasisPerson('A') + (joint?0:svBasisPerson('B')) + N(c.ins.kv)+N(c.ins.pv) + pins.A.basis;
 const basisB = joint ? (svBasisPerson('B') + pins.B.basis) : 0;
 const sonstA = inc.avA + (joint?0:inc.avB) + N(c.ins.av) + N(c.ins.other) + pins.A.vorsorge;
 const sonstB = joint ? (inc.avB + pins.B.vorsorge) : 0;
 const nr3A = Math.max(basisA, Math.min(basisA + sonstA, employedA ? 1900 : 2800));
 const nr3B = Math.max(basisB, Math.min(basisB + sonstB, employedB ? 1900 : 2800));
 const vors = inc.rvA + (joint?inc.rvB:0) + N(c.ins.rv) /* Altersvorsorge: employee RV fully */
 + pins.A.alters + pins.B.alters
 + nr3A + nr3B;
 // Sonderausgaben incl. per-child childcare (2025: 80% max €4,800/child; before: 2/3 max €4,000) and school fees (30% max €5,000/child)
 const ccRate = year>=2025 ? {r:0.80,cap:4800} : {r:2/3,cap:4000};
 let childcare=0, school=0;
 const kidsArr = c.fam.children||[];
 if(kidsArr.length){
 for(const k of kidsArr){
 childcare += Math.min(N(k.childcare)*ccRate.r, ccRate.cap);
 school += Math.min(N(k.schoolFees)*0.30, 5000);
 }
 } else { /* legacy lump-sum fallback */
 const kidsN = Math.max(N(c.fam.kids),1);
 childcare = N(c.fam.childcare)>0 ? Math.min(N(c.fam.childcare)*ccRate.r, ccRate.cap*kidsN) : 0;
 school = Math.min(N(c.fam.schoolFees)*0.30, 5000);
 }
 const sa = Math.max(joint?72:36, N(c.sa.donations)) + childcare + school // § 10c Pauschbetrag 36/72
 + Math.min(pins.A.riester, 2100) + (joint ? Math.min(pins.B.riester, 2100) : 0)
 + Math.min(N(c.oth.realsplitting), 13805); // Realsplitting § 10 (1a) Nr. 1 (Anlage U)
 // § 33a support to needy relatives: capped per-person at Grundfreibetrag × that person's own country-group factor (no zumutbare Belastung), then summed across the whole list
 const support = (c.unt||[]).reduce((sum, u) => {
   const grpFactor = {1:1, 2:0.75, 3:0.5, 4:0.25}[u.supportGroup] ?? 1;
   return sum + Math.min(N(u.support), (TARIFF[year]||TARIFF[2025]).gfb * grpFactor);
 }, 0);
 // rental property (Anlage V): net result per property - losses reduce taxable income
 const propNet = (c.props||[]).reduce((a,p)=>a + (N(p.rent)-propCosts(p)), 0);
 // außergewöhnliche Belastung - zumutbare Belastung per § 33 Abs. 3 EStG, tier-wise (BFH VI R 75/14)
 const kidsN = (c.fam.children||[]).length;
 const gde = Math.max(0, gross + propNet - wk); // approximated Gesamtbetrag der Einkünfte
 const zPct = kidsN>=3 ? [0.01,0.01,0.02]
 : kidsN>=1 ? [0.02,0.03,0.04]
 : (joint ? [0.04,0.05,0.06] : [0.05,0.06,0.07]);
 let zumutbar = Math.min(gde,15340)*zPct[0];
 if(gde>15340) zumutbar += (Math.min(gde,51130)-15340)*zPct[1];
 if(gde>51130) zumutbar += (gde-51130)*zPct[2];
 // § 33b lump sums: count WITHOUT zumutbare Belastung
 const GDB={ '20':384,'30':620,'40':860,'50':1140,'60':1440,'70':1780,'80':2120,'90':2400,'100':2840,'blind':7400 };
 const disab = (GDB[c.oth.gdbA]||0) + (joint?(GDB[c.oth.gdbB]||0):0)
 + N(c.oth.fahrtA) + (joint?N(c.oth.fahrtB):0)
 + N(c.oth.pflegeA) + (joint?N(c.oth.pflegeB):0);
 const agb = Math.max(0, N(c.ex.medical) - zumutbar) + support + disab;
 // § 24b Entlastungsbetrag für Alleinerziehende: 4,260 € + 240 € per further child
 const entl = (!joint && c.p.singleParent==='yes' && kidsN>=1) ? 4260 + 240*(kidsN-1) : 0;
 // § 24a Altersentlastungsbetrag: cohort-frozen percentage on wages (excl. Versorgungsbezüge)
 const aebFor = (birth, base) => {

 const by=parseInt(String(birth).slice(0,4)); if(!by || by<1900 || by>year-15) return 0; // guard against invalid dates
 const first=by+65; if(first>year) return 0; // 64th year completed before the tax year
 let p; if(first<=2005) p=40;
 else if(first<=2020) p=40-1.6*(first-2005);

/* Builds a standalone "single filer" simulation for one spouse, used to

   get POOLED as if they were one person's data whenever marital isn't
   'married' (confirmed directly in the code, not assumed), so this
   function must first FILTER each list down to just this person's own
   entries before calling computeEstimate - otherwise both spouses'
   income would incorrectly get combined into a single "individual".

   fields with a B suffix) also need moving into the "A" slot, since
   computeEstimate only reads the "A" version of these once marital
   isn't 'married'.

   model are household-level with no per-spouse split at all (shared
   insurance, donations, property, children's costs, extraordinary
   expenses). Real Einzelveranlagung requires an actual allocation

 clone.wkItems = (clone.wkItems||[]).filter(isThisPerson);
 clone.privIns = (clone.privIns||[]).filter(isThisPerson);
 clone.rente = (clone.rente||[]).filter(isThisPerson);
 clone.kap = (clone.kap||[]); // KAP has no person field in this app's model - split via sparer/kapGains below instead

 // Household-level fields with no per-spouse split in this app's data model - approximated 50/50, honestly documented above
 const half = v => { const n = N(v); return n ? String(n/2) : v; };
 clone.ex = clone.ex||{}; clone.ex.medical = half(c.ex?.medical); clone.ex.household = half(c.ex?.household); clone.ex.handwerker = half(c.ex?.handwerker);
 clone.fam = clone.fam||{}; clone.fam.support = half(c.fam?.support);
 (clone.fam.children||[]).forEach((k,i)=>{ const orig=(c.fam.children||[])[i]; if(orig){ k.childcare=half(orig.childcare); k.schoolFees=half(orig.schoolFees); } });

 clone.props = (clone.props||[]).map((p,i)=>{ const orig=(c.props||[])[i]; if(orig){ p.rent=half(orig.rent); } return p; });
 clone.oth = clone.oth||{};
 ['realsplitting','soGain','soUnterhalt','lossCarry','ersatz','emWalls','emRoof','emCeiling','emWindows','emVentilation','emHeating'].forEach(k=>{ clone.oth[k]=half(c.oth?.[k]); });
 clone.ins = clone.ins||{}; ['rv','kv','pv','av','other'].forEach(k=>{ clone.ins[k]=half(c.ins?.[k]); });

 /* Tab-navigation fix: every field commit triggers a full re-render (this app has no
 virtual-DOM diffing), which destroys the DOM node the browser was about to focus
 natively on Tab. Restore focus to whichever field was queued by the Tab handler. */
 if(pendingFocusKey){
 const target = app.querySelector(`[data-tabkey="${CSS.escape(pendingFocusKey)}"]`);
 if(target){ target.focus(); if(target.select) try{ target.select(); }catch(e){} }
 pendingFocusKey = null;
 }
 /* CORRECTED: real bug found via direct feedback - the live Steuernummer
    checksum check only ever ran when the person actively edited the
    field. Navigating away and back re-rendered the step from scratch,
    which left the result message genuinely blank - not because the

    when really nothing had been validated at all - a stale, misleading
    state either way. Now the check also runs once whenever this step

/* Tab key across fields: intercept Tab/Shift+Tab on any tracked field, commit its value
 (via blur, same as clicking away), and queue the next/previous field to be focused
 once render() finishes rebuilding the DOM. */
let pendingFocusKey = null;
document.addEventListener('keydown', function(e){
 if(e.key !== 'Tab') return;
 const el = e.target;
 if(!el || !el.hasAttribute || !el.hasAttribute('data-tabkey')) return;
 const all = Array.from(document.querySelectorAll('[data-tabkey]')).filter(x=>!x.disabled && x.offsetParent!==null);
 const idx = all.indexOf(el);
 if(idx===-1) return;
 const nextIdx = e.shiftKey ? idx-1 : idx+1;
 if(nextIdx<0 || nextIdx>=all.length) return; // let the browser handle tabbing out of the form normally
 e.preventDefault();
 pendingFocusKey = all[nextIdx].getAttribute('data-tabkey');
 el.blur(); // commits the current value exactly as clicking away would; if it actually
 // changed, onchange fires synchronously -> render() consumes pendingFocusKey immediately
 /* Fallback for when the value did NOT change: onchange never fires, so render() never

 some later, unrelated render. By the time this runs, the synchronous path above (if it
 fired) has already cleared pendingFocusKey, so this is a safe no-op in the common case. */
 setTimeout(()=>{
 if(!pendingFocusKey) return;
 const target = document.querySelector(`[data-tabkey="${CSS.escape(pendingFocusKey)}"]`);
 if(target){ target.focus(); if(target.select) try{ target.select(); }catch(e){} }
 pendingFocusKey = null;
 }, 0);
 }, true);

/* IMPLEMENTED: real modal accessibility - focus trapping, Escape-to-
   close, and proper ARIA dialog semantics - addressing a genuine gap
   the audit names specifically under its accessibility findings
   ("modal focus trapping"). Attached once, permanently, to document
   itself rather than to any specific modal element: this app's
   modals are built by dozens of different functions throughout the
   code (showPayModal, confirmDeleteAccount, showInfoModal, and many
   more), each just setting slot.innerHTML directly, and the
   modal-slot element itself is destroyed and recreated on every
   re-render. A listener on document works correctly no matter how
   many times that happens or which function created the current
   modal - editing every individual modal-creating function
   individually would be slower and risk missing one. */
let modalFocusReturnTo = null;
function getFocusableInModal(modal){
 return Array.from(modal.querySelectorAll(
 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
 )).filter(el => el.offsetParent !== null);
}
new MutationObserver((mutations) => {
 for(const m of mutations){
 for(const node of m.addedNodes){
 if(node.nodeType!==1) continue;
 const bg = node.classList?.contains('modal-bg') ? node : node.querySelector?.('.modal-bg');
 if(!bg) continue;
 const dialog = bg.querySelector('.modal');
 if(!dialog || dialog.hasAttribute('role')) continue; // already initialized (e.g. a re-render replaced siblings, not this modal itself)
 dialog.setAttribute('role','dialog');
 dialog.setAttribute('aria-modal','true');
 modalFocusReturnTo = document.activeElement;
 const focusable = getFocusableInModal(dialog);
 (focusable[0] || dialog).focus?.();
 }
 }
}).observe(document.body, { childList: true, subtree: true });
document.addEventListener('keydown', function(e){
 const bg = document.querySelector('.modal-bg'); if(!bg) return;
 if(e.key === 'Escape'){ bg.remove(); if(modalFocusReturnTo?.focus) modalFocusReturnTo.focus(); modalFocusReturnTo = null; return; }
 if(e.key !== 'Tab') return;
 const dialog = bg.querySelector('.modal'); if(!dialog) return;
 const focusable = getFocusableInModal(dialog); if(!focusable.length) return;
 const first = focusable[0], last = focusable[focusable.length-1];
 if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
 else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

/* --- multi-year: clone a client's personal data into a new tax year --- */
function samePerson(a,b){
 if(a.p.taxId && b.p.taxId) return a.p.taxId.replace(/\s/g,'')===b.p.taxId.replace(/\s/g,'');
 /* CORRECTED: real bug found via direct feedback - matching on
    firstName/lastName/birthDate when ALL THREE are blank on both
    records meant every incomplete draft client matched every other
    incomplete draft client as "the same person," since '' === ''
    for all three fields simultaneously. That incorrectly excluded
    every other year the moment a second blank client existed,
    leaving only the oldest year selectable. Now requires genuine,
    non-blank identifying data before two records are ever considered
    the same person - no identifying data means "unknown," not
    "match." */
 if(!a.p.firstName || !a.p.lastName || !b.p.firstName || !b.p.lastName) return false;
 return a.p.firstName===b.p.firstName && a.p.lastName===b.p.lastName && (a.p.birthDate||'')===(b.p.birthDate||'');
}
function personYears(c){
 const years = S.clients.filter(o=>samePerson(o,c)).map(o=>o.taxYear);
 if(!years.includes(c.taxYear)) years.push(c.taxYear); // always exclude this exact record's own year, regardless of whether samePerson can positively identify it (e.g. still-blank name)
 return years;
}
/* IMPLEMENTED: a proper, styled in-app info modal, replacing native

 S._pendingStartupModal = message;

/* CORRECTED: real gap found via direct feedback - the old stepDone()
   only checked "does any data exist," so a step with several required
   (*) fields left blank still showed a green checkmark the moment ONE
   field was filled in. Now returns three real states based on the
   actual required fields for each step: 'empty' (nothing entered),
   'incomplete' (started but missing something required), 'done'
   (everything required is genuinely present). Steps without a
   meaningful all-or-nothing requirement (Capital gains, Werbungskosten,
   Special expenses, Private expenses, Household) stay binary
   empty/done, since there's no real "half-finished" state for them. */
function stepDone(c,i){
 const has=v=>v!=null && String(v).trim()!=='';
 switch(i){
 case 0: {
 const married=['married','married_sep','getrennt_lebend'].includes(c.p.marital);
 const base=[c.p.firstName,c.p.lastName,c.p.birthDate,c.p.taxId,c.p.street,c.p.houseNo,c.p.plz,c.p.city,c.p.marital];
 const anyBase=base.some(has) || has(c.p.steuernummer);
 if(!anyBase) return 'empty';
 let ok=base.every(has) && has(c.p.steuernummer);
 if(ok && married) ok = has(c.p.spouseFirst) && has(c.p.spouseBirth) && has(c.p.spouseTaxId);
 return ok?'done':'incomplete';
 }
 case 1: {
 const emps=c.emps||[]; if(!emps.length) return 'empty';
 const ok=emps.every(e=>has(e.employer)&&has(e.taxClass)&&N(e.gross)>0);
 return ok?'done':'incomplete';
 }
 case 2: return (c.kap||[]).length>0?'done':'empty';
 case 3: {
 if(!((N(c.wk.commuteDays)+N(c.wk.equipment)+N(c.wk.homeOffice)+N(c.wk.training)+N(c.wk.other)+N(c.wk.arbeitszimmer)+N(c.wk.dhhRent)+N(c.wk.relocation)>0) || (c.wkItems||[]).length>0 || ((c.p.marital==='married'||c.p.marital==='married_sep') && N(c.wkB.commuteDays)+N(c.wkB.equipment)+N(c.wkB.homeOffice)+N(c.wkB.training)+N(c.wkB.other)+N(c.wkB.arbeitszimmer)+N(c.wkB.dhhRent)+N(c.wkB.relocation)>0))) return 'empty';
 /* CORRECTED: real gap found via direct feedback - this case previously
 had no way to return 'incomplete' at all, so the commute workplace
 address (confirmed genuinely required by ELSTER once a distance is
 entered, via a real ERiC rejection) was never actually checked here,
 only in the separate pre-submission validation - meaning the sidebar
 could show this step as "done" while a field required for the actual
 submission was still missing. Matches the exact same completeness
 pattern just fixed for Realsplitting in case 6. Checks both persons
 independently, since each has their own commute distance and
 workplace address. */
 if(N(c.wk.commuteKm)>0 && !has(c.wk.commuteWorkplace)) return 'incomplete';
 if((c.p.marital==='married'||c.p.marital==='married_sep') && N(c.wkB.commuteKm)>0 && !has(c.wkB.commuteWorkplace)) return 'incomplete';
 /* Real, confirmed ERiC business-rule requirement (not just schema-
    optional) - once double-household rent is entered, the reason,
    date established, employment location, own-household declaration,
    and continuous-until date are all genuinely required together
    (confirmed via a real ERiC rejection that the two dates must be
    paired); once "own household: yes" is selected, its PLZ/Ort and
    since-date are also required; once family-home trips are entered,
    the travel-mode declaration is also required. */
 if(N(c.wk.dhhRent)>0 && (!has(c.wk.dhhReason) || !has(c.wk.dhhDate) || !has(c.wk.dhhWorkplace) || !has(c.wk.dhhOwnHousehold) || !has(c.wk.dhhContinuousUntil))) return 'incomplete';
 if(c.wk.dhhOwnHousehold==='yes' && (!has(c.wk.dhhOwnPlz) || !has(c.wk.dhhOwnSince))) return 'incomplete';
 if(N(c.wk.dhhTrips)>0 && !has(c.wk.dhhTravelMode)) return 'incomplete';
 if((c.p.marital==='married'||c.p.marital==='married_sep')){
 if(N(c.wkB.dhhRent)>0 && (!has(c.wkB.dhhReason) || !has(c.wkB.dhhDate) || !has(c.wkB.dhhWorkplace) || !has(c.wkB.dhhOwnHousehold) || !has(c.wkB.dhhContinuousUntil))) return 'incomplete';
 if(c.wkB.dhhOwnHousehold==='yes' && (!has(c.wkB.dhhOwnPlz) || !has(c.wkB.dhhOwnSince))) return 'incomplete';
 if(N(c.wkB.dhhTrips)>0 && !has(c.wkB.dhhTravelMode)) return 'incomplete';
 }
 return 'done';
 }
 case 4: {
 const kids=c.fam.children||[]; if(!kids.length) return 'empty';
 const singleParent=['single','verwitwet','getrennt_lebend'].includes(c.p.marital);
 const ok=kids.every(k=>has(k.name)&&has(k.birth)&&has(k.familienkasse)&&(!singleParent||has(k.otherParentName))
   &&(!(N(k.childcare)>0)||(has(k.ccProvider)&&has(k.ccPeriodFrom)&&has(k.ccPeriodTo))));
 return ok?'done':'incomplete';
 }
 case 5: {
 const list = c.unt||[];
 if(!list.some(u=>N(u.support)>0)) return 'empty';
 const ok = list.every(u => N(u.support)>0 ? (
   has(u.untName)&&has(u.untProfession)&&has(u.untBirthDate)&&has(u.untRelationship)
   &&has(u.untAddress)&&has(u.untHouseholdSize)&&has(u.untFrom)&&has(u.untTo)
   &&has(u.untCohabitation)&&has(u.untKindergeld)&&has(u.untOtherContributor)&&has(u.untHasAssets)&&has(u.untHasIncome)
 ) : true);
 return ok?'done':'incomplete';
 }
 case 6: {
 if(!(N(c.sa.donations)+N(c.ins.other)+N(c.oth.realsplitting)>0)) return 'empty';
 /* CORRECTED: real gap found via direct feedback - this case previously
 had no way to return 'incomplete' at all, so the Realsplitting
 ex-spouse Tax ID/name (required by ELSTER once an amount is entered,
 already marked with a real "*" on the field labels) was never
 actually checked here, only in the separate pre-submission validation
 - meaning the sidebar could show this step as "done" while a required
 field for the actual submission was still missing. Matches the same
 completeness pattern already used correctly for Children/Family
 support just above. */
 if(N(c.oth.realsplitting)>0 && (!has(c.oth.realsplitIdnr) || !has(c.oth.realsplitName))) return 'incomplete';
 return 'done';
 }
 case 7: return (c.privIns||[]).length>0?'done':'empty';
 case 8: {
 const props=c.props||[]; if(!props.length) return 'empty';
 const ok=props.every(p=>has(p.street)&&has(p.plz)&&has(p.city));
 return ok?'done':'incomplete';
 }
 case 9: return (N(c.ex.medical)+N(c.ex.household)+N(c.ex.handwerker)>0)?'done':'empty';
 case 10: return c.status==='submitted'?'done':'empty';
 case 11: return ((c.inq||[]).length>0 && c.inq.every(q=>q.status==='answered'))?'done':'empty';
 } return 'empty';
}
/* Real field-level navigation, not just section-level - built
   additively alongside stepDone rather than changing its existing
   return shape, since that's used elsewhere for the sidebar badges.
   Starts with Personal data, where every field is fixed and its
   data-tabkey is predictable ("p.fieldname"). List-based steps
   (Employment income, Property, Children) use runtime-generated item
   IDs in their tabkeys ("emps.e1.gross") that can't be predicted
   from a static map the same way - those still fall back to the
   step-level jump, honestly, rather than guess at an ID. Returns the
   exact tabkey of the first missing required field, or null if this
   step doesn't have a fixed-field mapping (yet) or nothing is missing. */
function firstMissingFieldTabkey(c,i){
 const has=v=>v!=null && String(v).trim()!=='';
 if(i===0){
 const married=['married','married_sep','getrennt_lebend'].includes(c.p.marital);
 const order=[['firstName','p.firstName'],['lastName','p.lastName'],['birthDate','p.birthDate'],['taxId','p.taxId'],
   ['street','p.street'],['houseNo','p.houseNo'],['plz','p.plz'],['city','p.city'],['marital','p.marital'],
   ['steuernummer','p.steuernummer']];

/* Simple, honest substring ranking - no fuzzy-match guessing that could
   confidently point someone at the wrong place. A query matching the
   start of a word ranks above one only matching mid-word, and shorter,
   more specific entries rank above long ones containing the same term
   incidentally. Returns the best matches, or an empty list if nothing
   genuinely matches - callers are expected to say so honestly rather
   than show an unrelated top result. */
function searchApp(c, query){
 const q = String(query||'').trim().toLowerCase();
 if(!q || q.length<2) return [];
 const index = buildSearchIndex(c);
 /* CORRECTED: real bug found via direct testing - "anlage v" was
    matching "Anlage Vorsorgeaufwand" too, since plain .includes()
    treats it as a valid substring match regardless of word
    boundaries. A word-boundary regex means "anlage v" only matches
    where it genuinely starts a word ("Anlage V", not the "v" buried
    inside "Vorsorgeaufwand"). Escaping the query since it becomes
    part of a regex here. */
 const qEsc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
 /* Trailing boundary only required for multi-word queries - a
    deliberate, complete phrase like "anlage v" shouldn't match mid-word
    into "anlage vorsorgeaufwand", but a single word still needs to
    match as a genuine in-progress prefix ("kinderbetr" while someone
    is still typing "kinderbetreuung"), so it doesn't get a trailing
    boundary requirement. */
 const boundaryRe = new RegExp('\\b' + qEsc + (q.includes(' ') ? '\\b' : ''));
 const scored = index.map(e => {
   let score = 0;
   if(boundaryRe.test(e.text)){
     score = e.text.startsWith(q) ? 2 : 1;
     score += Math.max(0, 1 - e.text.length/200); // slight preference for more specific, shorter entries
   }
   return { ...e, score };
 }).filter(e=>e.score>0);
 scored.sort((a,b)=>b.score-a.score);
 const seen = new Set(); const out=[];
 for(const s of scored){ const key=s.step+'|'+s.label; if(seen.has(key)) continue; seen.add(key); out.push(s); if(out.length>=8) break; }
 return out;
}

/* --- field helper: binds to c[group][key] --- */
/* Bounded to the client's own tax year, not always "today" - filling in
   a 2021 return should never show a date picker reaching up to 2026.
   Still capped at the real current date too, since a date genuinely
   cannot be in the future regardless of which year is being filed. */
const dateMax = () => {
  const c = cur();
  const today = new Date().toISOString().slice(0,10);
  if (!c || !c.taxYear) return today;
  const yearEnd = c.taxYear + '-12-31';
  return yearEnd < today ? yearEnd : today;
};

/* ---------- Finanzamt directory (official ERiC data, static file) ---------- */
/* Loaded once from assets/finanzamt-directory.json (generated by
   tools/export-finanzaemter.js directly against ERiC - see that script's
   header comment). Falls back to manual text entry if the file is
   missing (e.g. before the export has been run yet), so the wizard never

let _faDirectory = null, _faDirectoryLoading = null;
async function loadFinanzamtDirectory(){
 if(_faDirectory) return _faDirectory;
 if(_faDirectoryLoading) return _faDirectoryLoading;
 _faDirectoryLoading = fetch('assets/finanzamt-directory.json').then(r=>r.ok?r.json():null)
 .then(d=>{ _faDirectory = d ? d.directory : null; return _faDirectory; })
 .catch(()=>{ _faDirectory = null; return null; });
 return _faDirectoryLoading;
}

 ` : `
 <input id="fa-search-input" value="${currentLabel}" placeholder="${t('fa_search_ph')}" autocomplete="off"

 onblur="setTimeout(closeFaDropdown,150)">

/* CRITICAL: this updates ONLY the dropdown container directly via the DOM,
   never calling the app's global render() while the user is typing. The
   global render() replaces the whole screen's innerHTML, which would
   destroy and recreate the <input> element itself on every keystroke -
   the new element never has focus, so typing a second character becomes
   impossible (this was the exact bug reported: dropdown flashes once on
   the initial click/focus, then immediately closes because the input
   that had focus no longer exists after the rebuild). Keeping the input
   untouched while only swapping the dropdown's own innerHTML preserves
   focus and cursor position correctly. */
function renderFaDropdown(query){
 const c=cur(); const land=c.p.bundesland;
 const slot=document.getElementById('fa-dropdown-slot'); if(!slot) return;
 if(_faDirectory===null){ loadFinanzamtDirectory().then(()=>renderFaDropdown(query)); return; }
 if(!_faDirectory || !land){ slot.innerHTML=''; return; }
 /* Merges every directory key that matches the selected state exactly
    OR starts with "<state> (" - some states (Bayern, Nordrhein-
    Westfalen) are split across multiple regional-authority entries in
    ERiC's own directory rather than one entry per Bundesland. */
 try {
   const matchingKeys = Object.keys(_faDirectory).filter(k => k === land || k.startsWith(land + ' ('));
   if(!matchingKeys.length){ slot.innerHTML=''; return; }
   const allEntries = matchingKeys.flatMap(k => _faDirectory[k] || []);
   const q=(query||'').toLowerCase();
   /* CORRECTED: the real bug, found via a self-diagnosing debug build -
      this only ever searched the office NAME, never the office NUMBER
      (bufaNr). Searching by the 4-digit number (a completely natural
      thing to do, especially once a number is already visible in the
      field) matched nothing, even though the underlying data and the
      Bayern/NRW merge were both already correct - confirmed directly via
      the debug output showing real entry counts (56 + 37) that were
      then filtered down to zero by this one-sided name-only check. */
   const matches=allEntries.filter(f=>!q || (f && f.name && (f.name.toLowerCase().includes(q) || (f.bufaNr||'').includes(q)))).slice(0,25);
   if(matches.length){
     slot.innerHTML = `<div class="fa-dropdown">${matches.map(f=>
     `<div class="fa-option" onmousedown="selectFinanzamt('${esc(f.bufaNr)}','${esc(f.name).replace(/'/g,"\\'")}')">
     <b>${esc(f.name)}</b><span>${esc(f.bufaNr)}</span></div>`).join('')}</div>`;
   } else {
     slot.innerHTML = `<div class="fa-dropdown"><div class="fa-option" style="color:var(--ink-soft);cursor:default">${t('fa_no_match')}</div></div>`;
   }
 } catch(err) {
   console.error('[renderFaDropdown]', err);
   slot.innerHTML = '';
 }
 return;
}
function closeFaDropdown(){
 const slot=document.getElementById('fa-dropdown-slot');
 if(slot) slot.innerHTML='';
}
function selectFinanzamt(bufaNr, name){

 const c=cur(); c.p.finanzamt = name; c.p.faNumber = bufaNr; c.updatedAt=Date.now();

 const reqEmpty = isReqEmpty(label, v);
 if(opts.select){
 return `<div class="field${reqEmpty?' req-empty':''}"><label>${label}${ai}${infoBtn}</label>
 <select data-tabkey="${fkey}" onchange="upd('${group}','${key}',this.value)">

 onchange="upd('${group}','${key}',this.value,${opts.euro?1:0})">${hint}</div>`;

/* Shared by F/LF/CF - "required" is detected the same way it already
   is for the visible "*" (label ends with it), and "empty" means no
   real value yet. Date fields are excluded from the empty check when
   they show today's max-date placeholder rather than a real blank,
   since that's a display default, not a value the person entered. */
function isReqEmpty(label, v){
 if(!label || !label.trim().endsWith('*')) return false;
 return v==null || String(v).trim()==='';
}
/* CORRECTED: real, confirmed bug found via direct feedback - several
 sections (N-AUS foreign employment, and similar) are built with raw,
 custom HTML templates rather than the shared F()/CF()/LF() field
 functions, so they never got the amber required-field background at
 all, despite every one of them showing a hardcoded asterisk in the
 label - the visual marker existed with no actual logic behind it.
 This is the same real highlighting check as isReqEmpty, just usable
 directly inside a raw template string rather than through the shared
