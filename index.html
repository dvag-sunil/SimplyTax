function reqCls(v){ return (v==null || String(v).trim()==='') ? ' req-empty' : ''; }
function upd(group,key,val,fmt){
 val = validDate(val); val = validAmount(val, fmt);
 const c=cur();
 if(fmt && String(val).trim()!=='') val = formatDE(N(val)); // display in German format: 1.234,56
 c[group][key]=val; c.updatedAt=Date.now();
 delete S.aiFields[group+'.'+key]; // user edited → no longer pure AI value
 /* CORRECTED: real bug found - switching Bundesland never cleared the
    previously-selected Finanzamt, so the search field kept showing a
    stale selection from the OLD state (e.g. staying on a Frankfurt/
    Hessen office no matter which new state was picked) even though the
    underlying dropdown SEARCH logic itself was already correctly
    filtering by the new state - the input's displayed value just never
    got reset to reflect that. Cleared here, before render(), so the
    field visibly empties out the moment the state changes, prompting a
    fresh search rather than silently keeping an inconsistent selection. */
 if(group==='p' && key==='bundesland'){ c.p.finanzamt=''; c.p.faNumber=''; }
 /* Real, confirmed bug found via direct user feedback - switching
    marital status away from married never cleared the spouse's own
    fields, so a stale spouse Tax ID (entered during earlier testing,
    for instance) kept silently sitting in the data even for a
    currently-single filer - exactly the same class of staleness bug
    already fixed once for Bundesland/Finanzamt above, just never
    caught here until it caused a confusing, wrongly-labeled
    validation error at submission time. */
 if(group==='p' && key==='marital' && val!=='married' && val!=='married_sep'){
   c.p.spouseTaxId=''; c.p.spouseFirst=''; c.p.spouseLast=''; c.p.spouseBirth=''; c.p.spouseReligion='';
 }
 scheduleSave(); render();
 if(group==='p' && key==='taxId') checkTaxIdChecksum(val);
 if(group==='p' && key==='spouseTaxId') checkTaxIdChecksum(val, 'spousetaxid-check-msg');
 if(group==='p' && key==='iban') checkIbanChecksum(val);
 if(group==='p' && (key==='steuernummer'||key==='faNumber')) checkSteuernummerChecksum();
 if(group==='oth' && key==='realsplitIdnr') checkTaxIdChecksum(val, 'realsplitidnr-check-msg');
 if(group==='fam' && key==='untIdnr') checkTaxIdChecksum(val, 'untidnr-check-msg');
 if(group==='p' && key==='taxId' || group==='p' && key==='spouseTaxId' || group==='oth' && key==='realsplitIdnr' || group==='fam' && key==='untIdnr') checkDuplicateIdNrs();
 if(group==='oth' && (key==='emBuildDate'||key==='emMeasureStart')) checkEm35cAge();
}
/* Real IBAN checksum validation via ERiC's EricMtPruefeIBAN (through
 /api/eric/validate-fields) - same pattern and same safety properties as
 checkTaxIdChecksum: updates a separate stable container directly, never
 calls the global render() from this async callback, and degrades
 silently if the backend service isn't configured yet. */
let _ibanCheckSeq = 0;
async function checkIbanChecksum(val){
 const iban=(val||'').replace(/\s/g,'').toUpperCase();
 const msgEl=()=>document.getElementById('iban-check-msg');
 if(iban.length<15){ const el=msgEl(); if(el) el.innerHTML=''; return; }
 const seq = ++_ibanCheckSeq;
 try{
 const r = await api('/api/eric/validate-fields','POST',{iban});
 if(seq!==_ibanCheckSeq) return;
 const el=msgEl(); if(!el) return;
 if(r && r.iban && r.iban.valid===false){
 el.innerHTML = `<div class="hint" style="color:var(--red)">⚠ ${t('iban_invalid_checksum')}</div>`;
 } else if(r && r.iban && r.iban.valid===true){
 el.innerHTML = `<div class="hint" style="color:var(--teal)">✓ ${t('iban_valid_checksum')}</div>`;
 }
 } catch(e){ /* service unavailable - degrade silently, never block the wizard */ }
}
/* Steuernummer needs the 4-digit Finanzamt number together with it (the

 const stnr=(c.p.steuernummer||'').trim();

 const msgEl=()=>document.getElementById('stnr-check-msg');
 if(!stnr || !/^\d{4}$/.test(bufaNr) || !c.p.bundesland){ const el=msgEl(); if(el) el.innerHTML=''; return; }
 const seq = ++_stnrCheckSeq;
 try{

 if(seq!==_stnrCheckSeq) return;
 const el=msgEl(); if(!el) return;
 if(r && r.steuernummer && r.steuernummer.valid===false){
 el.innerHTML = `<div class="hint" style="color:var(--red)">⚠ ${t('stnr_invalid_checksum')}</div>`;

/* Real checksum validation via ERiC's own EricMtPruefeIdentifikationsMerkmal
 (through the backend's /api/eric/validate-fields route) - catches a typo'd

 stable container directly, never calling the global render() from this

let _taxIdCheckSeq = 0;
async function checkTaxIdChecksum(val, msgId){
 msgId = msgId || 'taxid-check-msg';
 const digits=(val||'').replace(/\s/g,'');
 const msgEl=()=>document.getElementById(msgId);
 if(!/^\d{11}$/.test(digits)){ const el=msgEl(); if(el) el.innerHTML=''; return; }
 const seq = ++_taxIdCheckSeq;
 try{

 if(seq!==_taxIdCheckSeq) return; // a newer check superseded this one
 const el=msgEl(); if(!el) return;
 if(r && r.taxId && r.taxId.valid===false){
 el.innerHTML = `<div class="hint" style="color:var(--red)">⚠ ${t('taxid_invalid_checksum')}</div>`;

 el.innerHTML = `<div class="hint" style="color:var(--teal)">✓ ${t('taxid_valid_checksum')}</div>`;
 }
 } catch(e){ /* service unavailable - degrade silently, never block the wizard */ }
}
/* Real gap found via testing against a genuine client file (Regel
   101100155) - ELSTER rejects an IdNr that's reused across different
   people, since IDs are uniquely assigned per person. The app never
   checked this client-side before, so it only surfaced as a raw ERiC
   rejection after submission. Compares every ID actually collected:
   the filer's own, the spouse's, the Unterhalt supported person's, and
   the Realsplitting ex-spouse's - any two matching (and non-blank) is
   always wrong, regardless of which specific pair. */
function checkDuplicateIdNrs(){
 const c=cur(); if(!c) return;
 const clean=v=>(v||'').replace(/\s/g,'');
 const ids=[
 {key:'taxId', label:t('dup_idnr_filer'), val:clean(c.p.taxId)},
 {key:'spouseTaxId', label:t('dup_idnr_spouse'), val:clean(c.p.spouseTaxId)},
 ...(c.unt||[]).map((u,i)=>({key:'unt'+u.id, label:`${t('dup_idnr_unt')} ${i+1}`, val:clean(u.untIdnr)})),
 {key:'realsplitIdnr', label:t('dup_idnr_realsplit'), val:clean(c.oth?.realsplitIdnr)},
 ...(c.fam?.children||[]).map((k,i)=>({key:'child'+k.id, label:`${t('dup_idnr_child')} ${i+1}`, val:clean(k.taxId)})),
 ].filter(x=>x.val.length===11);
 let msg='';
 for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
 if(ids[i].val===ids[j].val){
 msg = `<div class="hint" style="color:var(--red)">⚠ ${t('dup_idnr_found')} (${ids[i].label} / ${ids[j].label})</div>`;
 }
 }
 /* Shown wherever a message slot currently exists in the DOM - could be
    the Personal data screen, a specific child's card, or both if the
    person switches steps mid-edit. Each slot gracefully no-ops if not
    present on the current page. */
 const el1=document.getElementById('dup-idnr-check-msg'); if(el1 && msg) el1.innerHTML=msg;
 (c.unt||[]).forEach(u=>{ const el=document.getElementById('untidnr-check-msg-'+u.id); if(el && msg) el.innerHTML=msg; });
 (c.fam?.children||[]).forEach(k=>{ const el=document.getElementById('childtaxid-check-msg-'+k.id); if(el && msg) el.innerHTML=msg; });
}
/* Real gap: the 10-year building-age rule (Regel 102240003) already
   had a static hint, but no live check - it only ever surfaced as an
   error at the very end via the Freigabe warning, same blind spot as
   the ID issues above. This computes the same real rule the backend
   already checks, but as soon as both dates are entered, not after
   the fact. */
function checkEm35cAge(){
 const c=cur(); if(!c) return;
 const el=document.getElementById('em35c-age-check-msg'); if(!el) return;
 const bd=c.oth?.emBuildDate, ms=c.oth?.emMeasureStart;
 if(!bd || !ms){ el.innerHTML=''; return; }
 const years=(new Date(ms)-new Date(bd))/(365.25*24*3600*1000);
 if(years<10){
 el.innerHTML=`<div class="hint" style="color:var(--red)">⚠ ${t('em35c_age_warning')}</div>`;
 } else {
 el.innerHTML='';
 }
}

/* Wraps a single LF() field with a prominent Zeile-number badge, so it

   inside the label text. Built on top of LF() itself, not a separate
   rendering path - every existing behavior (AI-filled flag, required
   highlighting, tab navigation) keeps working unchanged. */
function zeileField(num, list, item, field, label, opts={}){
 return `<div class="zeile-row"><span class="zeile-num">${num}</span>${LF(list,item,field,label,opts)}</div>`;
}
function addItem(list,tpl){ const c=cur(); const item=Object.assign({id:uid()},tpl); (c[list]=c[list]||[]).push(item); c.updatedAt=Date.now(); scheduleSave(); render(); return item.id; }
function delItem(list,id){ const c=cur(); c[list]=(c[list]||[]).filter(x=>x.id!==id); c.updatedAt=Date.now(); scheduleSave(); render(); }
function updItem(list,id,f,v,fmt){ v = validDate(v); v = validAmount(v, fmt); const c=cur(); const it=(c[list]||[]).find(x=>x.id===id); if(!it) return;
 if(fmt && String(v).trim()!=='') v=formatDE(N(v));
 it[f]=v; delete S.aiFields[list+'.'+id+'.'+f]; c.updatedAt=Date.now();
 /* Real gap found while converting family support to a repeatable
    list - this checksum check already existed for the old
    single-entry field via upd(), but updItem() (used by every
    repeatable-list field via LF()) never had an equivalent hook at
    all, so this safety feature would have silently stopped working
    the moment this became a list. */
 if(list==='unt' && f==='untIdnr') checkTaxIdChecksum(v, 'untidnr-check-msg-'+id);
 if(list==='unt' && f==='untIdnr') checkDuplicateIdNrs();
 scheduleSave(); render(); }

/* image compression: max 2200px edge, JPEG q0.85 - text on receipts stays sharp */
function readDataUrl(f){ return new Promise((res,rej)=>{ const r=new FileReader();
 r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read')); r.readAsDataURL(f); }); }
function compressImage(file){
 return new Promise((resolve)=>{
 const url=URL.createObjectURL(file);
 const img=new Image();
 img.onload=async ()=>{
 URL.revokeObjectURL(url);
 try{
 const MAX=2200; let w=img.width,h=img.height;
 if(w>MAX||h>MAX){ const k=Math.min(MAX/w,MAX/h); w=Math.round(w*k); h=Math.round(h*k); }
 const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
 cv.getContext('2d').drawImage(img,0,0,w,h);
 const out=cv.toDataURL('image/jpeg',0.85);
 const orig=await readDataUrl(file);
 resolve(out.length < orig.length ? out : orig); // never make the file bigger
 }catch(e){ resolve(await readDataUrl(file).catch(()=>null)); }
 };
 img.onerror=async ()=>{ URL.revokeObjectURL(url); resolve(await readDataUrl(file).catch(()=>null)); };
 img.src=url;
 });
}

function docSection(sec){
 const c=cur(); const docs=(c.docs||[]).filter(d=>d.section===sec);
 const rows = docs.map(d=>`<div class="sum-row">
 <span class="l">📎 ${esc(d.name)} <span class="csub">(${Math.max(1,Math.round(d.size/1024))} KB · ${dateStr(d.ts)})</span></span>
 <span class="r" style="white-space:nowrap">
 <button class="btn-sm link-btn" onclick="downloadDoc('${d.id}','${esc(d.name)}')">⬇ ${t('download')}</button>
 <button class="btn-sm link-btn" onclick="deleteDoc('${d.id}',this)">🗑</button></span>
 </div>`).join('');
 return `<div class="section-label">${t('docs_h')}</div>
 <p style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">${t('docs_lead')}</p>
 <div class="sum-group">${rows || `<div class="sum-row"><span class="l" style="font-style:italic">${t('no_docs')}</span></div>`}</div>
 <button class="btn btn-ghost btn-sm" onclick="S.docTarget='${sec}';document.getElementById('docInput').click()">📎 ${t('add_doc')}</button>`;
}
document.getElementById('docInput').addEventListener('change', async e=>{
 const files=[...e.target.files]; e.target.value='';
 const c=cur(); if(!c) return;
 const okType = f => {
 const t=(f.type||'').toLowerCase(), n=(f.name||'').toLowerCase();
 if(t.startsWith('image/')) return true;
 if(t==='application/pdf' || n.endsWith('.pdf')) return true;
 if(t==='application/msword' || t==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'
 || n.endsWith('.doc') || n.endsWith('.docx')) return true;
 if(!t && /\.(jpe?g|png|gif|webp|heic)$/.test(n)) return true;
 return false;
 };
 for(const f of files){
 if(!okType(f)){ alert(t('doc_bad_type')); continue; }
 try{
 const dataUrl = (f.type||'').startsWith('image/') ? await compressImage(f) : await readDataUrl(f);
 if(!dataUrl){ continue; }
 const bytes = Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75);
 if(bytes > 5*1024*1024){ alert(t('doc_too_big')); continue; } // 5 MB after compression (ELSTER-friendly)
 const id=uid();
 await storeDocData(id,dataUrl);
 (c.docs=c.docs||[]).push({id,name:f.name,size:bytes,section:S.docTarget||'fam',ts:Date.now()});
 }catch(err){ console.error(err); }
 }
 c.updatedAt=Date.now(); scheduleSave(); render();
});
async function downloadDoc(id,name){
 let d=await getDocData(id); if(!d) return;
 if(/^https?:/.test(d)){
 try{ const b=await (await fetch(d)).blob(); d=URL.createObjectURL(b); }
 catch(e){ window.open && window.open(d,'_blank'); return; }
 }
 const a=document.createElement('a'); a.href=d; a.download=name; document.body.appendChild(a); a.click(); a.remove();
 if(d.startsWith('blob:')) setTimeout(()=>URL.revokeObjectURL(d), 60000);
}
async function deleteDoc(id,btn){
 setBtnBusy(btn,true);
 const c=cur(); c.docs=(c.docs||[]).filter(x=>x.id!==id);
 await removeDocData(id); c.updatedAt=Date.now(); scheduleSave(); render();
}

/* --- step 5: children & family support --- */
function CF(kid,field,label,opts={}){
 const type=opts.type||'text';
 const hint=opts.hint?`<div class="hint">${opts.hint}</div>`:'';
 const tk=`child.${kid.id}.${field}`;
 const reqEmpty = isReqEmpty(label, kid[field]);
 if(opts.select){
 return `<div class="field${reqEmpty?' req-empty':''}"><label>${label}</label>
 <select data-tabkey="${tk}" onchange="updChild('${kid.id}','${field}',this.value)">
 ${opts.select.map(o=>`<option value="${o[0]}" ${(kid[field]||'')===o[0]?'selected':''}>${o[1]}</option>`).join('')}
 </select>${hint}</div>`;
 }
 return `<div class="field${reqEmpty?' req-empty':''}"><label>${label}</label>
 <input data-tabkey="${tk}" type="${type}" value="${esc(kid[field]||'')}" placeholder="${opts.ph||''}" ${opts.euro?'inputmode="decimal"':opts.inputmode?`inputmode="${opts.inputmode}"`:''} ${opts.maxlength?`maxlength="${opts.maxlength}"`:''} ${opts.pattern?`pattern="${opts.pattern}"`:''} ${type==='date'?`min="1940-01-01" max="${dateMax()}"`:''}
 onchange="updChild('${kid.id}','${field}',this.value,${opts.euro?1:0})">${hint}</div>`;
}
function addChild(){ const c=cur(); (c.fam.children=c.fam.children||[]).push({id:uid(),name:'',birth:'',taxId:'',kinship:'leiblich',familienkasse:'',otherParentName:'',kindergeld:'',childcare:'',ccProvider:'',ccPeriodFrom:'',ccPeriodTo:'',schoolFees:'',behMobility:false,behBlindHelpless:false,behValidIndefinite:false,behValidFrom:'',behValidTo:'',behSplitPercent:''}); c.updatedAt=Date.now(); scheduleSave(); render(); }
function delChild(id){ const c=cur(); c.fam.children=(c.fam.children||[]).filter(k=>k.id!==id); c.updatedAt=Date.now(); scheduleSave(); render(); }
function updChild(id,f,v,fmt){ v = validAmount(v, fmt); const c=cur(); const k=(c.fam.children||[]).find(x=>x.id===id); if(!k) return;
 if(fmt && String(v).trim()!=='') v=formatDE(N(v)); k[f]=v; c.updatedAt=Date.now(); scheduleSave(); render();
 if(f==='taxId'){ checkTaxIdChecksum(v, 'childtaxid-check-msg-'+id); checkDuplicateIdNrs(); }
}

/* ---------------- real ERiC submission flow (§ 87d Freigabe + backend routes) ---------------- */
/* CORRECTED: real gap found in the production audit - this used to be a
   small, non-cryptographic 32-bit rolling checksum, trivially collidable,
   for what's meant to be legally significant § 87d evidence. The
   authoritative record is now the server-computed SHA-256 written to the
   submission_approvals table before ERiC is ever called (see server.js) -
   this client-side copy is upgraded to genuine SHA-256 too, via the
   browser's own crypto.subtle, so nothing relying on it client-side is
   weaker than the real evidence. Async because Web Crypto's digest is
   promise-based; callers already await this. */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* Finds the E-code inside a raw ERiC field path/message and replaces
   it with its real, human meaning wherever one is known - used to
   clean up both the Feldidentifikator path and any field reference
   embedded directly in an error's own text. */
function humanizeFieldPath(text){
 if(!text) return text;
 return text.replace(/E\d{7}/g, code => FIELD_LABEL_LOOKUP[code] || code);
}
/* Stronger than humanizeFieldPath alone - given a full raw internal
 path like "$/SA[1]/Weit_Aufw[1]/U_Leist[1]/Einz[1]/E0104305[1]$",
 returns just the clean human label on its own ("Identifikationsnummer
 der unterstützten Person"), not the label still wrapped in the
 technical $/.../[N]$ syntax - since showing someone a readable label
 sitting inside brackets and dollar signs isn't actually clean. Falls
 back to the original raw path, unchanged, if no E-code inside it is
 recognized - never guesses at an unfamiliar one. */
function extractFieldLabel(rawPath){
 const m = rawPath.match(/E\d{7}/);
 if(m && FIELD_LABEL_LOOKUP[m[0]]) return FIELD_LABEL_LOOKUP[m[0]];
 return rawPath;
}
const ERIC_ERROR_PATTERNS = [
 { re: /^Das Feld '(.+?)' wird im angegebenen Veranlagungszeitraum bzw\. bei der angegebenen Veranlagungsart nicht unterstützt\.$/,
   en: m => `The field '${extractFieldLabel(m[1])}' is not supported for the specified tax year or filing type.`,
   de: m => `Das Feld '${extractFieldLabel(m[1])}' wird im angegebenen Veranlagungszeitraum bzw. bei der angegebenen Veranlagungsart nicht unterstützt.` },
 { re: /^Es fehlt die Angabe zum Staat \((.+?)\)\.$/,
   en: m => `The country is missing (${m[1]}).`,
   de: m => `Es fehlt die Angabe zum Staat (${m[1]}).` },
 { re: /^Feld '(.+?)': Ungültige Identifikationsnummer\.$/,
   en: m => `Invalid identification number for the field '${extractFieldLabel(m[1])}'.`,
   de: m => `Ungültige Identifikationsnummer für das Feld '${extractFieldLabel(m[1])}'.` },
 { re: /^Die Art der Ordnungsnummer muss im Feld (.+?) angegeben werden\.$/,
   en: m => `The type of reference number must be provided in field '${extractFieldLabel(m[1])}'.`,
   de: m => `Die Art der Ordnungsnummer muss im Feld '${extractFieldLabel(m[1])}' angegeben werden.` },
 { re: /^Die Bundesfinanzamtsnummer und die ersten 4 Stellen der Steuernummer unterscheiden sich\.$/,
   en: () => `The Finanzamt office number and the first 4 digits of the Steuernummer don't match.`,
   de: () => `Die Bundesfinanzamtsnummer und die ersten 4 Stellen der Steuernummer unterscheiden sich.` },
];
function translateEricError(text){
 if(!text) return text;
 for(const p of ERIC_ERROR_PATTERNS){
 const m = text.match(p.re);
 if(m) return humanizeFieldPath((S.lang==='de' ? p.de : p.en)(m));
 }
 return humanizeFieldPath(text); // no known sentence pattern - shown honestly as-is, but any embedded field code is still humanized
}
function parseFehlerRegelpruefung(resultXml){
 if(!resultXml) return [];
 try{
 const doc = new DOMParser().parseFromString(resultXml, 'text/xml');
 const nodes = Array.from(doc.getElementsByTagName('FehlerRegelpruefung'));
 return nodes.map(n=>{
 const textNode = n.getElementsByTagName('Text')[0];
 const fieldNode = n.getElementsByTagName('Feldidentifikator')[0];
 const regelNode = n.getElementsByTagName('RegelName')[0];

  });

function importElsterFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch (err) { alert('Could not read this file as JSON: ' + err.message); return; }
    if (data.meta?.format !== 'simplytax-interchange') {
      if (!confirm('This file does not look like a SimplyTax interchange file. Import anyway?')) return;
    }
    try {
      const c = importElsterDataset(data);
      S.clients.push(c); scheduleSave();
      S.currentId = c.id; S.view = 'client'; S.step = 10;
      render();
    } catch (err) {
      alert('Import failed: ' + err.message);
      console.error('[import]', err);
    }
  };
  reader.readAsText(file);
}

function bindGlobal(){
 const dz=document.getElementById('dz');
 if(dz){
 ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));
 ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));

/* =====================================================================
 Deterministic extraction sanitizer - does NOT trust the AI output.
 The Bescheinigung prints EUR and Ct in two columns split by a vertical
 line; vision models sometimes concatenate them (4.533|75 -> "453375",
 i.e. exactly 100x the real value). German social-insurance lines have
 LEGAL contribution ceilings, so a 100x value is mathematically
 detectable and repairable in code - independent of the model.
===================================================================== */
function sanitizeExtraction(j){
 /* --- 1. kfb (Kinderfreibeträge) must never be a copy of taxClass --- */
 const tc = String(j.taxClass??'').trim();
 if(j.kfb!=null && String(j.kfb).trim()!==''){
 const kfRaw = String(j.kfb).trim();
 if(tc && kfRaw===tc){ j.kfb=''; } // the known misread: Steuerklasse copied into kfb
 else{
 const kn = parseFloat(kfRaw.replace(',','.'));
 // valid Kinderfreibeträge: 0-9.5 in steps of 0.5
 if(!Number.isFinite(kn) || kn<0 || kn>9.5 || Math.round(kn*2)!==kn*2) j.kfb='';
 }
 }
 if(tc && !/^[1-6]$/.test(tc)) j.taxClass=''; // taxClass must be a single digit 1-6

 /* --- 2. EUR|Ct concatenation repair via legal contribution ceilings --- */
 /* caps: generous upper bounds (2025 Beitragsbemessungsgrenzen + margin).
 Trigger only when the integer-only value exceeds cap*3 (order-of-magnitude
 error) AND value/100 fits under the cap - so a legitimately high value
 slightly above the cap is never touched. */
 const CAP = { agRV:12000, agRVb:26000, anRV:12000, anRVb:26000,
 agKV:8000, agPKV:8000, agPV:3000,
 anKV:8000, anPV:3000, anAV:2200, pkv28:16000,
 soli:6000, churchPaid:12000, churchSpouse:12000 };
 const intOnly = v => /^\d+$/.test(String(v??'').trim());
 Object.keys(CAP).forEach(k=>{
 const v = String(j[k]??'').trim(); if(!v || !intOnly(v)) return;
 const n = parseInt(v,10), cap = CAP[k];
 if(n > cap*3 && n/100 <= cap) j[k] = (n/100).toFixed(2);
 });

 /* --- 3. cross-field repairs for the uncapped big numbers --- */
 const parsed = v => { const m=String(v??'').trim().match(/^(\d+)(?:\.(\d{1,2}))?$/); return m?parseFloat(m[0]):NaN; };
 let g = parsed(j.gross), w = parsed(j.wageTax);
 // wage tax can never exceed gross - if it does and it's integer-only, it's concatenated
 if(Number.isFinite(g) && Number.isFinite(w) && w>g && intOnly(j.wageTax) && w/100<=g){ j.wageTax=(w/100).toFixed(2); w=w/100; }
 // gross plausibility vs pension contribution: anRV is ~9.3% of gross (ceiling-capped);
 // gross > anRV*30 implies an RV rate under 0.33% - impossible unless gross is concatenated
 const rv = parsed(j.anRV);
 if(Number.isFinite(g) && Number.isFinite(rv) && rv>100 && intOnly(j.gross) && g>rv*30 && g/100>=rv*5){ j.gross=(g/100).toFixed(2); }

 /* --- 3b. legal-equality restore: Zeile 22a = Zeile 23a for statutory pension --- */
 /* Employer and employee pay equal halves of gesetzliche Rentenversicherung (§ 168 SGB VI),
 so 22a and 23a always print the same amount for standard employees. Vision models sometimes
 drop one of the two identical values as a "duplicate" - restore it from the other side. */
 if(!String(j.agRV??'').trim() && String(j.anRV??'').trim()) j.agRV = j.anRV;
 if(!String(j.agRVb??'').trim() && String(j.anRVb??'').trim()) j.agRVb = j.anRVb;

 /* --- 4. smear guard: employer subsidies (24a/24b/24c) duplicated from employee lines --- */
 /* On employee forms lines 24a-c are almost always empty; the model sometimes copies the
 adjacent employee value (25/26/28) into them. An exact-to-the-cent duplicate is the signature. */
 if(j.agKV && j.anKV && String(j.agKV).trim()===String(j.anKV).trim()) j.agKV='';
 if(j.agPV && j.anPV && String(j.agPV).trim()===String(j.anPV).trim()) j.agPV='';
 if(j.agPKV && j.pkv28 && String(j.agPKV).trim()===String(j.pkv28).trim()) j.agPKV='';
 return j;
}

/* Option B: confirming persists the choice for good (until explicitly
   revoked) and automatically continues with whatever file was waiting
   - no need to re-select it. Declining clears the pending file
   entirely; nothing is sent anywhere. Follows the same real modal-slot
   pattern every other modal in this app already uses (see
   delClient/showAusCalc), rather than a separate mechanism. */
function confirmAiConsent(){
 S.aiConsentGiven = true;
 saveState();
 const f = S.pendingAiFile; S.pendingAiFile = null;
 const el = document.querySelector('.modal-bg'); if(el) el.remove();
 if(f) handleFile(f);
}
function declineAiConsent(){
 S.pendingAiFile = null;
 const el = document.querySelector('.modal-bg'); if(el) el.remove();
}
/* Lets someone who already said yes change their mind later, from a
   small settings link rather than only during an upload in progress. */
function revokeAiConsent(){
 S.aiConsentGiven = false; saveState(); render();
}
function showAiConsentModal(file){
 S.pendingAiFile = file;
 const slot=document.getElementById('modal-slot'); if(!slot) return;
 slot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this){declineAiConsent();}"><div class="modal" style="max-width:440px">
 <h3>${t('ai_consent_title')}</h3>
 <p style="font-size:14px;line-height:1.6;margin:10px 0 16px">${t('ai_consent_body')}
 <a href="datenschutz.html#ai-doc-recognition${S.lang==='en'?'-en':''}" target="_blank" rel="noopener">${t('ai_consent_link')}</a></p>
 <div style="display:flex;gap:10px;justify-content:flex-end">
 <button class="btn btn-ghost" onclick="declineAiConsent()">${t('ai_consent_decline')}</button>
 <button class="btn btn-primary" onclick="confirmAiConsent()">${t('ai_consent_accept')}</button>
 </div>
 </div></div>`;
}
async function handleFile(file){
 /* Option B consent gate: real, persisted, one-time confirmation before
    any document ever reaches the AI provider - checked here since both
    the dropzone click and the drag-and-drop listener both funnel
    through this exact function, so gating it here covers both upload
    paths from a single place rather than duplicating the check. If
    consent hasn't been given yet, the file is held and this function
    is called again automatically the moment the person confirms - no
    silent bypass, nothing proceeds without a real, remembered "yes". */
 if(!S.aiConsentGiven){ showAiConsentModal(file); return; }
 S.scanState='scanning'; render();
 try{
 const b64 = await new Promise((res,rej)=>{ const r=new FileReader();
 r.onload=()=>res(r.result.split(',')[1]); r.onerror=()=>rej(new Error('read')); r.readAsDataURL(file); });
 const isPdf = file.type==='application/pdf';
 const prompt = `You are reading a German "Ausdruck der elektronischen Lohnsteuerbescheinigung" (annual wage tax certificate). Your task is to extract specific field values and return ONLY a valid JSON object - no markdown, no explanation, nothing else.

CRITICAL - EUR/Ct COLUMN LAYOUT (the most common parsing error):
The form has TWO narrow columns on the right: "EUR" and "Ct" (cents), separated by a vertical line.
The EUR column contains the euros (e.g. 48.750) and the Ct column contains the cents (e.g. 03).
You MUST read these as a SINGLE decimal number: EUR,Ct - so 48.750 | 03 = 48750.03 NOT 4875003.
Return all monetary values as a number with a dot as decimal separator, e.g. 48750.03, 8136.00, 4533.75.
NEVER concatenate the EUR and Ct digits without a decimal point.
If the Ct column shows "00", still include it: 48750.00 not 48750.

CRITICAL - FIELD IDENTITY RULES: - taxClass: a SINGLE digit 1-6 from the "Steuerklasse/Faktor" box. This is NEVER a decimal, NEVER more than one digit. If you see "4" in that box, taxClass = "4". - kfb (Kinderfreibeträge): a separate field, usually printed as "0,0" or "2,0" or similar. It is physically BELOW or BESIDE the Steuerklasse box. It is NEVER the same value as taxClass. If the Steuerklasse is 4, kfb might be "0,0" - do NOT copy the "4" into kfb. - idnr: the EMPLOYEE's personal 11-digit Identifikationsnummer (printed near the employee's name/address). NEVER the employer's Steuernummer (which has slashes like "181/815/08155") or Betriebsnummer. Leave empty "" if uncertain. - agRV (Zeile 22a) vs anRV (Zeile 23a): these are DIFFERENT fields on adjacent rows. Zeile 22a says "Arbeitgeber-Anteil/-Zuschuss ... a) zur gesetzlichen Rentenversicherung". Zeile 23a says "Arbeitnehmer-Anteil ... a) zur gesetzlichen Rentenversicherung". Read the LINE NUMBER carefully - do not swap them. IMPORTANT: Zeile 22a and Zeile 23a usually contain the IDENTICAL amount (employer and employee pay equal halves by German law). This is NOT a reading error and NOT a duplicate - you MUST extract BOTH values even when they are exactly the same. Never leave one of them empty because the other already has the same number. - Similarly: agKV (Zeile 24a) ≠ anKV (Zeile 25). agPV (Zeile 24c) ≠ anPV (Zeile 26).

FIELD MAPPING - match each JSON key to the exact Zeile number printed on the form:
employer = employer name from "Anschrift des Arbeitgebers" block (text, not a number)
period = Zeile 1 Bescheinigungszeitraum (text, e.g. "01.04.-31.12.")
taxClass = Steuerklasse/Faktor box (single digit 1-6 only)
kfb = Zahl der Kinderfreibeträge (decimal like 0.0 or 2.0, separate from taxClass)
idnr = employee's 11-digit Identifikationsnummer only (no slashes)
birthDate = Geburtsdatum in YYYY-MM-DD format
gross = Zeile 3 Bruttoarbeitslohn einschl. Sachbezüge
wageTax = Zeile 4 Einbehaltene Lohnsteuer
soli = Zeile 5 Einbehaltener Solidaritätszuschlag
churchPaid = Zeile 6 Einbehaltene Kirchensteuer des Arbeitnehmers
churchSpouse = Zeile 7 Einbehaltene Kirchensteuer des Ehegatten
vb8 = Zeile 8 In 3. enthaltene Versorgungsbezüge
vb9 = Zeile 9 Versorgungsbezüge für mehrere Kalenderjahre
ml10 = Zeile 10 Arbeitslohn für mehrere Kalenderjahre / Abfindungen
lst11 = Zeile 11 (unbesetzt on most recent forms - leave "")
soli12 = Zeile 12 (unbesetzt on most recent forms - leave "")
kist13 = Zeile 13 (unbesetzt on most recent forms - leave "")
kistSp14 = Zeile 14 (unbesetzt on most recent forms - leave "")
ersatz15 = Zeile 15 Leistungen die dem Progressionsvorbehalt unterliegen (Kurzarbeitergeld etc.)
kug15a = Zeile 15a (Saison-)Kurzarbeitergeld in 15. enthalten
dba16 = Zeile 16 Steuerfreier Arbeitslohn nach DBA/Auslandstätigkeitserlass (a+b combined)
fahrt17 = Zeile 17 Steuerfreie AG-Leistungen auf Entfernungspauschale anzurechnen
pausch18 = Zeile 18 Pauschal mit 15% besteuerte AG-Leistungen Fahrten
entsch19 = Zeile 19 (unbesetzt on most recent forms - leave "")
verpf20 = Zeile 20 Steuerfreie Verpflegungszuschüsse bei Auswärtstätigkeit
dhh21 = Zeile 21 Steuerfreie AG-Leistungen bei doppelter Haushaltsführung
agRV = Zeile 22a Arbeitgeber-Anteil/-Zuschuss zur gesetzlichen Rentenversicherung
agRVb = Zeile 22b Arbeitgeber-Anteil/-Zuschuss an berufsständische Versorgungseinrichtung
anRV = Zeile 23a Arbeitnehmer-Anteil zur gesetzlichen Rentenversicherung
anRVb = Zeile 23b Arbeitnehmer-Anteil an berufsständische Versorgungseinrichtung
agKV = Zeile 24a Arbeitgeber-Zuschuss zur gesetzlichen Krankenversicherung
agPKV = Zeile 24b Arbeitgeber-Zuschuss zur privaten Kranken-/Pflegeversicherung
agPV = Zeile 24c Arbeitgeber-Zuschuss zur gesetzlichen Pflegeversicherung
anKV = Zeile 25 Arbeitnehmer-Beiträge zur gesetzlichen Krankenversicherung
anPV = Zeile 26 Arbeitnehmer-Beiträge zur gesetzlichen Pflegeversicherung
anAV = Zeile 27 Arbeitnehmer-Beiträge zur Arbeitslosenversicherung
pkv28 = Zeile 28 Private Kranken-/Pflege-Pflichtversicherung oder Mindestvorsorgepauschale
bmg29 = Zeile 29 Bemessungsgrundlage für den Versorgungsfreibetrag
vbJahr30 = Zeile 30 Jahr des Versorgungsbeginns (4-digit year)
vbMon31 = Zeile 31 Erster/letzter Monat der Versorgungsbezüge
sterbe32 = Zeile 32 Sterbegeld / Abfindung Versorgungsbezüge
fb34 = Zeile 34 Versorgungsfreibetrag

Return this exact JSON structure (use "" for any field not found or empty on the form):
{"employer":"","period":"","taxClass":"","kfb":"","idnr":"","birthDate":"","gross":"","wageTax":"","soli":"","churchPaid":"","churchSpouse":"","vb8":"","vb9":"","ml10":"","lst11":"","soli12":"","kist13":"","kistSp14":"","ersatz15":"","kug15a":"","dba16":"","fahrt17":"","pausch18":"","entsch19":"","verpf20":"","dhh21":"","agRV":"","agRVb":"","anRV":"","anRVb":"","agKV":"","agPKV":"","agPV":"","anKV":"","anPV":"","anAV":"","pkv28":"","bmg29":"","vbJahr30":"","vbMon31":"","sterbe32":"","fb34":""}`;
 if(!BACKEND.enabled) throw new Error('backend_disabled');
 const dataUrl = isPdf ? `data:application/pdf;base64,${b64}` : `data:${file.type||'image/jpeg'};base64,${b64}`;
  const resp = await fetch(BACKEND.baseUrl+'/api/extract-doc', {
 method:'POST',
 credentials: 'include',
 headers:{ 'Content-Type':'application/json', ...(authToken?{'Authorization':'Bearer '+authToken}:{}) },
 body: JSON.stringify({ dataUrl, prompt })
 });
 if(!resp.ok){
   /* CORRECTED: a deliberately-disabled feature (operator turned off
      AI_AUTOFILL_ENABLED, or no API key configured) isn't a failure -
      it's expected, intentional behavior. Treating it the same as a
      genuine extraction error would show end users an alarming "failed"
      message for something that was never supposed to run at all. The
      document itself still uploads and stores normally either way -
      this only affects whether auto-fill is attempted. */
   let errCode = '';
   try{ errCode = (await resp.json()).error || ''; }catch(e){}
   if(errCode === 'extraction_disabled') throw new Error('extraction_disabled');
   throw new Error('extract_failed');
 }
 const data = await resp.json();
 const text = (data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n');
 const clean = text.replace(/```json|```/g,'').trim();
 const j = JSON.parse(clean);
 sanitizeExtraction(j); // deterministic repair of known model errors - never trusts raw AI output
 const c=cur();
 /* every upload creates a NEW income statement - existing entries are never overwritten */
 const emp={id:uid()};
 /* Parse a dot-decimal number from the AI (e.g. "50220.00") directly to German display format.
 N() is intentionally NOT used here: N("50220.00") treats the .00 as a decimal and returns
 50220 (whole number), then formatDE drops the ",00" - showing "50.220" instead of "50.220,00".
 We parse integer + decimal parts directly instead. */
 const aiNum = v => {
 const str = String(v).trim().replace(/[€\s]/g,'');
 if(!str || str==='0' || str==='0.00' || str==='0,00') return null;
 const m = str.match(/^(-?\d+)(?:\.(\d{1,2}))?$/); // dot-decimal from AI: 50220.00 or 50220
 if(m){
 const cents = (m[2]||'00').padEnd(2,'0');
 const intPart = m[1].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
 return intPart + ',' + cents;
 }
 // fallback: AI returned German format already ("50.220,00") - re-format explicitly with 2dp
 const num = N(str); if(num === 0) return null;
 return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(num);
 };
 const TEXTF={employer:1,period:1,taxClass:1,kfb:1,vbJahr30:1,vbMon31:1};
 const EMPKEYS=['employer','period','taxClass','kfb','gross','wageTax','soli','churchPaid','churchSpouse',
 'vb8','vb9','ml10','lst11','soli12','kist13','kistSp14','ersatz15','kug15a','dba16','fahrt17','pausch18',
 'entsch19','verpf20','dhh21','agRV','agRVb','anRV','anRVb','agKV','agPKV','agPV','anKV','anPV','anAV',
 'pkv28','bmg29','vbJahr30','vbMon31','sterbe32','fb34'];
 EMPKEYS.forEach(k=>{
 const val=j[k]; if(val==null || String(val).trim()==='') return;
 if(TEXTF[k]){ emp[k]=String(val); }
 else { const cv=aiNum(val); if(!cv) return; emp[k]=cv; } // skip empty/zero values to keep the card clean
 S.aiFields['emps.'+emp.id+'.'+k]=true;
 });
 (c.emps=c.emps||[]).push(emp);
 /* person A/B detection via Identifikationsnummer (married couples) */
 emp.person='A';
 const idnrRaw=j.idnr?String(j.idnr).replace(/\s/g,''):'';
 const idnrClean=/^\d{11}$/.test(idnrRaw) ? idnrRaw : ''; // Identifikationsnummer is ALWAYS exactly 11 digits;
 // anything else (e.g. a Steuernummer like 181/815/08155) is silently rejected here
 const aId=(c.p.taxId||'').replace(/\s/g,''), bId=(c.p.spouseTaxId||'').replace(/\s/g,'');
 if((c.p.marital==='married'||c.p.marital==='married_sep') && idnrClean){
 if(bId && idnrClean===bId){ emp.person='B'; }
 else if(aId && idnrClean!==aId){
 emp.person='B';
 if(!bId){ c.p.spouseTaxId=idnrClean; S.aiFields['p.spouseTaxId']=true; }
 }
 }
 /* personal data: fill ONLY if still empty and the document belongs to person A; employer's Finanzamt is ignored */
 if(emp.person==='A'){
 if(idnrClean && !(c.p.taxId||'').trim()){ c.p.taxId=idnrClean; S.aiFields['p.taxId']=true; }
 if(j.birthDate && !(c.p.birthDate||'').trim()){
 let b=String(j.birthDate).trim();
 const dmy=b.match(/^(\d{2})\.(\d{2})\.(\d{4})$/); if(dmy) b=`${dmy[3]}-${dmy[2]}-${dmy[1]}`;
 if(/^\d{4}-\d{2}-\d{2}$/.test(b)){ c.p.birthDate=b; S.aiFields['p.birthDate']=true; }
 }
 }
 c.updatedAt=Date.now(); scheduleSave();
 S.scanState='ok';
 }catch(err){
   if(err.message==='extraction_disabled'){ S.scanState=null; render(); return; } // deliberate, not an error - fail silently
   console.error('extraction failed',err); S.scanState='err';
 }
 render();
}

/* ---------------- boot ---------------- */
/* Paint an immediate loading screen before any network call - avoids the blank-page
 gap during backend auth/data fetch, especially on a cold-started free-tier server. */
(function(){
 /* pre-load the Finanzamt directory in the background - non-blocking,
 so the field just becomes fast/searchable once ready without delaying
 app startup. Falls back to manual entry silently if the file isn't
 deployed yet (see loadFinanzamtDirectory's own fallback). */
 loadFinanzamtDirectory().then(()=>render());
 /* password-reset deep link from the email */
 try{
 if(typeof location!=='undefined' && location.search){
 const q=new URLSearchParams(location.search);
  if(q.get('reset') && q.get('email')){
 S.resetToken=q.get('reset'); S.resetEmail=q.get('email'); S.authMode='reset';
 if(typeof history!=='undefined') history.replaceState({},'',location.pathname);
 }
 /* IMPLEMENTED: addresses a real gap the audit flagged directly - email
    verification was listed as "at minimum" production scope. Mirrors
    the reset-link handling right above, but calls the API directly on
    load rather than routing through a form - clicking the link should
    just confirm it, whether the person is currently logged in or not
    (the verify-email API route doesn't require auth, matching the
    password-reset route's own design). */
 if(q.get('verifyEmail') && q.get('email')){
 const vToken=q.get('verifyEmail'), vEmail=q.get('email');
 if(typeof history!=='undefined') history.replaceState({},'',location.pathname);
  api('/api/auth/verify-email','POST',{email:vEmail, token:vToken}).then(()=>{
 if(S.user && S.user.settings){ S.user.settings.emailVerified=true; }
 S.emailVerifyResult='ok'; render();
 }).catch(()=>{ S.emailVerifyResult='error'; render(); });
 }
 }
 }catch(e){}
 const langGuess = (()=>{ try{ return JSON.parse(localStorage.getItem('klarsteuer-prefs')||'{}').lang; }catch(e){ return null; } })() || 'en';
 const msg = STR[langGuess]?.loading || STR.en.loading;
 document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-soft)">
 <div style="width:34px;height:34px;border:3px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite"></div>
 <div id="boot-msg" style="font-size:14px">${msg}</div>
 <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
 </div>`;
 const slowTimer = setTimeout(()=>{
 const el=document.getElementById('boot-msg');
 if(el) el.textContent = STR[langGuess]?.loading_slow || STR.en.loading_slow;
 }, 3000);
 (async()=>{
 try{ await loadState(); await handleStripeReturn(); }
 finally{ clearTimeout(slowTimer); render(); }
 })();
})();
</script>
